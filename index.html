<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>file-history - GitHub File History</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(180deg, #f0f6ff 0%, #ffffff 100%);
      padding: 60px 20px 32px;
      border-bottom: 1px solid #e8edf5;
    }
    .page h1 {
      font-size: 1.7rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #656d76;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Search */
    .search-wrap { position: relative; width: 100%; }
    .search-wrap input {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      outline: none;
      -webkit-appearance: none;
    }
    .search-wrap input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9,105,218,0.12);
    }
    .search-wrap input::placeholder { color: #8b949e; }

    /* Suggestions */
    .sg-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      -webkit-overflow-scrolling: touch;
    }
    .sg-list.open { display: block; }
    .sg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      cursor: pointer;
      gap: 8px;
    }
    .sg-item:not(:last-child) { border-bottom: 1px solid #eef0f2; }
    .sg-item:hover, .sg-item.on { background: #f6f8fa; }
    .sg-item-left { display: flex; align-items: baseline; min-width: 0; gap: 6px; }
    .sg-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sg-hint { color: #8b949e; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sg-empty { padding: 10px 14px; color: #8b949e; font-size: 0.875rem; }

    .pill {
      font-size: 0.73rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-file      { background: #ddf4ff; color: #0969da; }
    .pill-dir       { background: #dafbe1; color: #1a7f37; }
    .pill-extension { background: #fff8c5; color: #9a6700; }

    /* Modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .card {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eef0f2;
    }
    .card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .card-head h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #656d76;
      cursor: pointer;
      line-height: 1;
      padding: 0 0 0 12px;
    }
    .card-close:hover { color: #24292f; }
    .card-share { background: none; border: none; font-size: 0.78rem; color: #656d76; cursor: pointer; padding: 0 8px 0 0; display: flex; align-items: center; gap: 4px; }
    .card-share:hover { color: #24292f; }
    .card-actions { display: flex; align-items: center; }
    .card-body { padding: 4px 20px 20px; }

    .field { padding: 10px 0; }
    .field + .field { border-top: 1px solid #eef0f2; }
    .field-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #656d76;
      margin-bottom: 6px;
    }

    /* Chart */
    .chart { width: 100%; height: auto; display: block; }
    .chart-grid { stroke: #eef0f2; stroke-width: 1; }
    .chart-axis { fill: #8b949e; font-size: 11px; }
    .chart-xlabel { fill: #656d76; font-size: 12px; font-weight: 500; }
    .chart-line { fill: none; stroke: #0969da; stroke-width: 2.5; }
    .chart-area { fill: rgba(9,105,218,0.08); }
    .chart-dot { fill: #fff; stroke: #0969da; stroke-width: 2.5; }
    .chart-value { fill: #0969da; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .chart-trend { font-size: 13px; font-weight: 600; }
    .chart-trend-up   { fill: #1a7f37; }
    .chart-trend-down { fill: #cf222e; }
    .chart-trend-flat { fill: #656d76; }

    table.evo { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.evo th, table.evo td { padding: 6px 4px; text-align: right; border-bottom: 1px solid #eef0f2; }
    table.evo th:first-child, table.evo td:first-child { text-align: left; color: #656d76; }
    table.evo th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: #8b949e; font-weight: 600; }
    table.evo td { font-variant-numeric: tabular-nums; }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e8edf5;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 1.3rem; font-weight: 600; color: #24292f; }
    .stat-label { font-size: 0.75rem; color: #656d76; margin-top: 2px; }

    .foot {
      text-align: center;
      color: #8b949e;
      font-size: 0.78rem;
      padding: 28px 16px 16px;
      border-top: 1px solid #e8edf5;
    }
    .foot a { color: #656d76; }

    #top-list { padding: 20px 20px 32px; }
    .top-group { margin-top: 28px; }
    .top-group-title { margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .top-group-title h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
    .pill-toggle { border: none; cursor: pointer; transition: opacity 0.15s; }
    .top-count { color: #8b949e; font-size: 0.8rem; }

    /* Top ten: a bar per name, its width the ratio today, so the section can be
       read as a ranking without looking at the numbers. */
    .rank { list-style: none; }
    .rank li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .rank-pos { color: #8b949e; font-size: 0.75rem; width: 18px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    /* The label column is a fixed share of the row, so every bar starts at the
       same x whether or not the row carries a pill; inside it the name is only
       as wide as its text, which keeps the pill next to the name. */
    .rank-label { width: 45%; flex-shrink: 0; display: flex; align-items: center; gap: 5px; min-width: 0; }
    .rank-name {
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem; color: #24292f; text-decoration: underline;
      flex: 0 1 auto; min-width: 0; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rank-name:hover { opacity: 0.7; }
    .rank-bar { flex: 1; height: 8px; background: #f0f2f5; border-radius: 4px; overflow: hidden; min-width: 0; }
    .rank-fill { height: 100%; border-radius: 4px; display: block; }
    .rank-fill-file      { background: #0969da; }
    .rank-fill-dir       { background: #1a7f37; }
    .rank-fill-extension { background: #d4a72c; }
    .rank-pct { font-size: 0.78rem; color: #656d76; width: 34px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .rank-arw { width: 12px; text-align: center; flex-shrink: 0; }
    .rank-label .pill { font-size: 0.65rem; padding: 1px 5px; }

    /* The same up/down/equal reading as the chart badge, small enough to sit
       next to a percentage. */
    .arw { font-size: 0.8rem; font-weight: 600; }
    .arw-up   { color: #1a7f37; }
    .arw-down { color: #cf222e; }
    .arw-flat { color: #8b949e; }

    .top-all { text-align: center; margin-top: 10px; }
    .top-toggle { background: none; border: none; color: #0969da; cursor: pointer; font-size: 0.8rem; padding: 4px; }
    .top-toggle:hover { text-decoration: underline; }
    .top-links { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
    .top-link { background: none; border: none; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; color: #24292f; font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .top-link:hover { opacity: 0.7; }

    @media (max-width: 500px) {
      .hero { padding: 40px 14px 24px; }
      .page h1 { font-size: 1.2rem; }
      .subtitle { font-size: 0.8rem; margin-bottom: 18px; }
      .sg-list { max-height: 50vh; }
      .card-head { padding: 14px 16px; }
      .card-body { padding: 4px 16px 16px; }
    }
  </style>
</head>

var YEARS = DATA.years, ITEMS = DATA.items;
var KINDS = ['file', 'dir', 'extension'];
var KIND_LABEL = { file: 'file', dir: 'dir', extension: 'extension' };
var idx = -1, results = [], current = null;

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function highlight(s, q) {
  var at = s.toLowerCase().indexOf(q.toLowerCase());
  if (!q || at < 0) return esc(s);
  return esc(s.slice(0, at)) + '<strong>' + esc(s.slice(at, at + q.length)) + '</strong>' + esc(s.slice(at + q.length));
}

function pill(kind) {
  return '<span class="pill pill-' + kind + '">' + esc(KIND_LABEL[kind]) + '</span>';
}

function key(it) { return it.k + '#' + it.n; }
function latest(it) { return it.r[it.r.length - 1]; }

/* How the ratio moved from the first snapshot to the newest one, used by the
   chart badge, the suggestions and the rankings alike. */
function delta(it) { return latest(it) - it.r[0]; }
function direction(it) { var d = delta(it); return d > 0 ? 'up' : d < 0 ? 'down' : 'flat'; }
function glyph(it) { var d = delta(it); return d > 0 ? '\u2191' : d < 0 ? '\u2193' : '='; }
function arrow(it) {
  var dir = direction(it);
  return '<span class="arw arw-' + dir + '" title="' + glyph(it) + ' ' + (delta(it) > 0 ? '+' : '') + delta(it)
    + ' from ' + esc(YEARS[0]) + '">' + glyph(it) + '</span>';
}

/* Names starting with the query come first, the rest are matched anywhere, so
   typing "test" offers test/ and tests/ before jest.config.js. */
function search(q) {
  if (!q) return [];
  var ql = q.toLowerCase(), starts = [], contains = [];
  for (var i = 0; i < ITEMS.length; i++) {
    var at = ITEMS[i].n.toLowerCase().indexOf(ql);
    if (at === 0) starts.push(ITEMS[i]);
    else if (at > 0) contains.push(ITEMS[i]);
    if (starts.length >= 15) break;
  }
  return starts.concat(contains).slice(0, 15);
}

var input = document.getElementById('q');
var sg = document.getElementById('sg');

function render(list, q) {
  idx = -1; results = list;
  if (!list.length) {
    if (q) {
      sg.innerHTML = '<div class="sg-empty">No results for "' + esc(q) + '" — only names in more than 100 repositories today are listed</div>';
      sg.classList.add('open');
    } else { sg.innerHTML = ''; sg.classList.remove('open'); }
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += '<div class="sg-item" data-i="' + i + '">'
      + '<div class="sg-item-left"><span class="sg-name">' + highlight(list[i].n, q) + '</span>'
      + '<span class="sg-hint">' + latest(list[i]) + '% today ' + arrow(list[i]) + '</span></div>'
      + pill(list[i].k) + '</div>';
  }
  sg.innerHTML = html;
  sg.classList.add('open');
  var rows = sg.querySelectorAll('.sg-item');
  for (var j = 0; j < rows.length; j++) {
    rows[j].addEventListener('click', (function(k) {
      return function() { show(results[k]); sg.classList.remove('open'); };
    })(j));
  }
}

/* The chart is drawn as plain SVG: one point per snapshot, the ratio on a
   fixed 0-100 axis so two names can be compared by eye. */
function chart(it) {
  var W = 440, H = 210, L = 34, R = 14, T = 40, B = 30;
  var pw = W - L - R, ph = H - T - B;
  var x = function(i) { return L + (YEARS.length === 1 ? pw / 2 : pw * i / (YEARS.length - 1)); };
  var y = function(v) { return T + ph - ph * v / 100; };

  /* The arrow says whether the name is more or less common now than in the
     first snapshot; it sits on its own row above the plot, so it never lands on
     a point label. */
  var diff = delta(it), dir = direction(it);
  var badge = glyph(it) + ' ' + (diff > 0 ? '+' : '') + diff + ' from ' + YEARS[0];

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ratio over time, ' + dir + ' ' + diff + ' points">';
  svg += '<text class="chart-trend chart-trend-' + dir + '" x="' + (W - R) + '" y="16" text-anchor="end">' + esc(badge) + '</text>';
  for (var g = 0; g <= 100; g += 25) {
    svg += '<line class="chart-grid" x1="' + L + '" y1="' + y(g) + '" x2="' + (W - R) + '" y2="' + y(g) + '"/>'
      + '<text class="chart-axis" x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + g + '%</text>';
  }
  var pts = [];
  for (var i = 0; i < YEARS.length; i++) pts.push(x(i) + ',' + y(it.r[i]));
  svg += '<polygon class="chart-area" points="' + x(0) + ',' + y(0) + ' ' + pts.join(' ') + ' ' + x(YEARS.length - 1) + ',' + y(0) + '"/>';
  svg += '<polyline class="chart-line" points="' + pts.join(' ') + '"/>';
  for (var i = 0; i < YEARS.length; i++) {
    svg += '<circle class="chart-dot" cx="' + x(i) + '" cy="' + y(it.r[i]) + '" r="4.5"/>'
      + '<text class="chart-value" x="' + x(i) + '" y="' + (y(it.r[i]) - 11) + '">' + it.r[i] + '%</text>'
      + '<text class="chart-xlabel" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(YEARS[i]) + '</text>';
  }
  return svg + '</svg>';
}

function table(it) {
  var head = '<tr><th>Snapshot</th><th>Repositories</th><th>Ratio</th></tr>';
  var body = '';
  for (var i = 0; i < YEARS.length; i++) {
    body += '<tr><td>' + esc(YEARS[i]) + '</td><td>' + it.f[i] + '</td><td>' + it.r[i] + '%</td></tr>';
  }
  return '<table class="evo">' + head + body + '</table>';
}

function show(it) {
  current = it;
  document.getElementById('cTitle').textContent = it.n;
  document.getElementById('cPill').innerHTML = pill(it.k);
  document.getElementById('cBody').innerHTML =
    '<div class="field"><div class="field-label">Repositories (%)</div>' + chart(it) + '</div>'
    + '<div class="field"><div class="field-label">Snapshots</div>' + table(it) + '</div>';
  document.getElementById('overlay').classList.add('open');
  /* #file#README.md: the kind is a plain segment and only the name is encoded,
     so the link stays readable. */
  history.replaceState(null, '', '#' + it.k + '#' + encodeURIComponent(it.n));
}

function byKey(k) {
  for (var i = 0; i < ITEMS.length; i++) if (key(ITEMS[i]) === k) return ITEMS[i];
  return null;
}

function showStats() {
  var counts = {};
  for (var i = 0; i < ITEMS.length; i++) counts[ITEMS[i].k] = (counts[ITEMS[i].k] || 0) + 1;
  var stats = [
    { n: counts.file || 0, l: 'Files' },
    { n: counts.dir || 0, l: 'Directories' },
    { n: counts.extension || 0, l: 'Extensions' },
    { n: YEARS.length, l: 'Snapshots' }
  ];
  var html = '';
  for (var i = 0; i < stats.length; i++) {
    html += '<div class="stat"><div class="stat-num">' + stats[i].n + '</div><div class="stat-label">' + stats[i].l + '</div></div>';
  }
  document.getElementById('stats').innerHTML = html;
}

/* Each kind gets its top ten by ratio today, with the rest of its names behind
   a toggle: the long lists are useful but should not push the sections apart. */
var TOP_N = 10;

/* One ranked row: the bar is the ratio today, so rows can be compared across
   sections even when the ranking itself is by something else. */
function rankRow(pos, i, withPill) {
  var it = ITEMS[i];
  return '<li><span class="rank-pos">' + pos + '</span>'
    + '<span class="rank-label">'
    + '<button class="top-link rank-name" data-i="' + i + '" title="' + esc(it.n) + '">' + esc(it.n) + '</button>'
    + (withPill ? pill(it.k) : '') + '</span>'
    + '<span class="rank-bar"><span class="rank-fill rank-fill-' + it.k + '" style="width:' + latest(it) + '%"></span></span>'
    + '<span class="rank-pct">' + latest(it) + '%</span>'
    + '<span class="rank-arw">' + arrow(it) + '</span></li>';
}

function section(title, note, rows, withPill) {
  if (!rows.length) return '';
  var html = '<div class="top-group"><div class="top-group-title"><h2>' + title + '</h2>'
    + '<span class="top-count">' + note + '</span></div><ol class="rank">';
  for (var i = 0; i < rows.length; i++) html += rankRow(i + 1, rows[i], withPill);
  return html + '</ol></div>';
}

function showTop() {
  var groups = {}, all = [];
  for (var i = 0; i < ITEMS.length; i++) {
    (groups[ITEMS[i].k] = groups[ITEMS[i].k] || []).push(i);
    all.push(i);
  }
  var html = '';
  for (var ki = 0; ki < KINDS.length; ki++) {
    var kind = KINDS[ki], list = groups[kind];

    html += '<div class="top-group" data-kind="' + esc(kind) + '">'
      + '<div class="top-group-title"><h2>Top ' + top.length + '</h2>' + pill(kind)
      + '<span class="top-count">of ' + list.length + '</span></div><ol class="rank">';
    for (var li = 0; li < top.length; li++) html += rankRow(li + 1, top[li], false);
    html += '</ol>';
    if (rest.length) {
      html += '<div class="top-all"><button class="top-toggle" data-kind="' + esc(kind) + '">Show all ' + list.length + '</button>'
        + '<div class="top-links" style="display:none">';
      for (var ri = 0; ri < rest.length; ri++) {
        html += '<button class="top-link" data-i="' + rest[ri] + '">' + esc(ITEMS[rest[ri]].n) + '</button>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }

  /* The rankings above are dominated by names that were already everywhere in
     2015, so movement gets sections of its own: what grew the most, what fell
     the most, and what did not exist in any earlier snapshot at all. */
  /* Which names belong in a section is decided by how much they moved, but the
     rows themselves are ordered by the ratio today, like every other section,
     so the bars always descend. */
  function byRatio(a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); }

  var rising = all.filter(function(i) { return delta(ITEMS[i]) > 0; })
    .sort(function(a, b) { return delta(ITEMS[b]) - delta(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); })
    .slice(0, TOP_N).sort(byRatio);
  var decaying = all.filter(function(i) { return delta(ITEMS[i]) < 0; })
    .sort(function(a, b) { return delta(ITEMS[a]) - delta(ITEMS[b]) || ITEMS[a].n.localeCompare(ITEMS[b].n); })
    .slice(0, TOP_N).sort(byRatio);
  var fresh = all.filter(function(i) {
      var f = ITEMS[i].f;
      for (var j = 0; j < f.length - 1; j++) if (f[j] > 0) return false;
      return true;
    })
    .sort(byRatio)
    .slice(0, TOP_N);

  html += section('Rising', 'biggest gain since ' + esc(YEARS[0]), rising, true);
  html += section('Declining', 'biggest drop since ' + esc(YEARS[0]), decaying, true);
  html += section('New', 'absent from every snapshot before ' + esc(YEARS[YEARS.length - 1]), fresh, true);

  var tl = document.getElementById('top-list');
  tl.innerHTML = html;
  var links = tl.querySelectorAll('.top-link');
  for (var bi = 0; bi < links.length; bi++) {
    links[bi].addEventListener('click', (function(btn) {
      return function() { show(ITEMS[parseInt(btn.dataset.i)]); };
    })(links[bi]));
  }
  var toggles = tl.querySelectorAll('.top-toggle');
  for (var pi = 0; pi < toggles.length; pi++) {
    toggles[pi].addEventListener('click', (function(btn) {
      return function() {
        var group = tl.querySelector('.top-group[data-kind="' + btn.dataset.kind + '"]');
        var rest = group.querySelector('.top-links');
        var collapsed = rest.style.display === 'none';
        rest.style.display = collapsed ? '' : 'none';
        btn.textContent = (collapsed ? 'Hide the other ' : 'Show all ') + (collapsed ? rest.children.length : rest.children.length + TOP_N);
      };
    })(toggles[pi]));
  }
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); history.replaceState(null, '', ' '); }

document.getElementById('cClose').addEventListener('click', closeModal);
document.getElementById('cShare').addEventListener('click', function() {
  navigator.clipboard.writeText(location.href).then(function() {
    var btn = document.getElementById('cShare');
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"/></svg>Copy link'; }, 1500);
  });
});
document.getElementById('overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

input.addEventListener('input', function() { var q = input.value.trim(); render(search(q), q); });
input.addEventListener('keydown', function(e) {
  var items = sg.querySelectorAll('.sg-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); hi(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); hi(items); }
  else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); show(results[idx]); sg.classList.remove('open'); }
  else if (e.key === 'Escape') sg.classList.remove('open');
});

function hi(items) {
  for (var i = 0; i < items.length; i++) {
    if (i === idx) { items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' }); }
    else items[i].classList.remove('on');
  }
}

document.addEventListener('click', function(e) {
  if (!document.getElementById('sw').contains(e.target)) sg.classList.remove('open');
});

showStats();
showTop();
input.focus();

/* A link carries #<kind>#<name>, but one with a bare name still opens the first
   item of that name. */
var hash = location.hash.slice(1);
if (hash) {
  var cut = hash.indexOf('#');
  var it = cut < 0 ? null : byKey(hash.slice(0, cut) + '#' + decodeURIComponent(hash.slice(cut + 1)));
  if (!it) {
    var name = decodeURIComponent(cut < 0 ? hash : hash.slice(cut + 1));
    for (var i = 0; i < ITEMS.length; i++) {
      if (ITEMS[i].n.toLowerCase() === name.toLowerCase()) { it = ITEMS[i]; break; }
    }
  }
  if (it) show(it);
}
</script>
