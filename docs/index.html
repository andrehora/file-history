        if (at === 0) starts.push(ITEMS[i]);
        else if (at > 0) contains.push(ITEMS[i]);
        if (starts.length >= 15) break;
      }
      return starts.concat(contains).slice(0, 15);
    }

    var input = document.getElementById('q');
    var sg = document.getElementById('sg');

    function render(list, q) {
      idx = -1; results = list;
      if (!list.length) {
        if (q) {
          sg.innerHTML = '<div class="sg-empty">No results for "' + esc(q) + '" — only names in at least ' + MIN_FREQ + ' repositories today are listed</div>';
          sg.classList.add('open');
        } else { sg.innerHTML = ''; sg.classList.remove('open'); }
        return;
      }
      var html = '';
      for (var i = 0; i < list.length; i++) html += suggestion(list[i], i, q);
      sg.innerHTML = html;
      sg.classList.add('open');
      var rows = sg.querySelectorAll('.sg-item');
      for (var j = 0; j < rows.length; j++) {
        rows[j].addEventListener('click', (function (k) {
          return function () { show(results[k]); sg.classList.remove('open'); };
        })(j));
      }
    }

    /* One row of a suggestion list. The home search and the compare picker offer
       the same names in the same shape, so they share the markup. */
    function suggestion(it, i, q) {
      return '<div class="sg-item" data-i="' + i + '">'
        + '<div class="sg-item-left"><span class="sg-name">' + highlight(it.n, q) + '</span>'
        + '<span class="sg-hint">' + latest(it) + '% today ' + arrow(it) + '</span></div>'
        /* The icon sits with the pill at the right end. A row devicon cannot
           draw keeps the blank, so the pills stay in one column. */
        + icon(it) + pill(it.k) + '</div>';
    }

    /* The chart is drawn as plain SVG: one point per snapshot, the ratio on a
       fixed 0-100 axis so two names can be compared by eye. Passing a second item
       draws it as a dashed line over the same axis; the trend badge then gives way
       to a key, since a badge for one of two lines would be ambiguous. */
    /* The axis tops out at a round number a little above the tallest reading, so
       the highest point never sits on the frame; every candidate divides by four,
       which is how many gridlines the plot draws. */
    function axisTop(max) {
      var tops = [4, 8, 12, 16, 20, 24, 32, 40, 48, 60, 80, 100];
      for (var i = 0; i < tops.length; i++) if (tops[i] >= max * 1.05) return tops[i];
      return 100;
    }

    /* Passing fit true scales the axis to the series drawn; left out, the axis is
       the full 0-100, on which any two names can be compared by eye. The hover
       preview always takes that default, so previews stay comparable row to row. */
    function chart(it, vs, fit, bars) {
      var extra = vs || [];
      /* The right margin holds half of the last year label, which is centred on
         its point: at 14 the "today" label ran off the viewBox. */
      /* The bottom margin carries the year labels far enough under the plot
         that a reading written below a point sitting on zero still clears
         them. */
      var W = 440, L = 34, R = 24, B = 40, ph = 140;

      /* With a comparison the plot needs a key. It runs across the top, one
         name after another, and only takes a second line when the names are too
         long to fit on one. Without a comparison that row is the trend badge,
         one line high. */
      var keyed = extra.length ? [it].concat(extra) : [];
      /* The key sits above the plot, where the axis labels do not reach, so it
         starts at the chart's own left edge rather than the plot's. */
      var keyRows = keyLayout(keyed, W - R);
      var T = keyed.length ? 16 * keyRows.length + 12 : 40;
      var H = T + ph + B;
      var pw = W - L - R;
      var top = 100;
      if (fit) {
        var max = 0, series = [it].concat(extra);
        for (var m = 0; m < series.length; m++) {
          for (var r = 0; r < series[m].r.length; r++) max = Math.max(max, series[m].r[r]);
        }
        top = axisTop(max);
      }
      /* A line puts its points on the edges of the plot, so the first and last
         sit on the axis; bars stand in bands, each centred in its own share of
         the width. The year labels follow whichever is drawn. */
      var band = pw / YEARS.length;
      var x = bars
        ? function (i) { return L + band * (i + 0.5); }
        : function (i) { return L + (YEARS.length === 1 ? pw / 2 : pw * i / (YEARS.length - 1)); };
      var y = function (v) { return T + ph - ph * v / top; };

      /* The arrow says whether the name is more or less common now than in the
         first snapshot; it sits on its own row above the plot, so it never lands on
         a point label. */
      var diff = delta(it), dir = direction(it);
      var badge = glyph(it) + ' ' + (diff > 0 ? '+' : '') + diff + ' from ' + YEARS[0];

      var names = [];
      for (var ni = 0; ni < extra.length; ni++) names.push(extra[ni].n);
      var label = (extra.length ? it.n + ' against ' + names.join(', ') + ', ratio over time'
        : 'ratio over time, ' + dir + ' ' + diff + ' points') + ', axis to ' + top + '%'
        + (bars ? ', as bars' : '');
      var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">';
      if (keyed.length) {
        for (var kr = 0; kr < keyRows.length; kr++) {
          var kx = 0;
          for (var kc = 0; kc < keyRows[kr].length; kc++) {
            var ent = keyRows[kr][kc];
            svg += chartKey(kx, 14 + 16 * kr, ent.i === 0 ? null : cmpColor(ent.i - 1), ent.n);
            kx += ent.w + KEY_GAP;
          }
        }
      } else {
        /* Centred over the plot: it reads as a caption on the whole chart, not a
           note pinned to the last point. */
        svg += '<text class="chart-trend chart-trend-' + dir + '" x="' + (L + (W - L - R) / 2) + '" y="16" text-anchor="middle">' + esc(badge) + '</text>';
      }
      for (var g = 0; g <= top; g += top / 4) {
        svg += '<line class="chart-grid" x1="' + L + '" y1="' + y(g) + '" x2="' + (W - R) + '" y2="' + y(g) + '"/>'
          + '<text class="chart-axis" x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + g + '%</text>';
      }
      /* Both series write above their points. With a single comparison the two
         readings can land on each other, so where they come within a line of
         one another the lower of the two drops below its point instead; a tie
         sends the comparison down, the item's own line being the one read. */
      var itBelow = [], vsBelow = [];
      if (extra.length === 1) {
        for (var b = 0; b < YEARS.length; b++) {
          var clash = Math.abs(y(it.r[b]) - y(extra[0].r[b])) < 14;
          itBelow[b] = clash && it.r[b] < extra[0].r[b];
          vsBelow[b] = clash && !itBelow[b];
        }
      }
      /* Whichever side is chosen, the reading has to stay inside the plot: a
         point near the top of a fitted axis has no room above it for a label,
         and one near zero has none below before the year row. */
      function labelY(v, below) {
        var above = y(v) - 11, under = y(v) + 18;
        if (below) return under > H - 20 ? above : under;
        return above < T + 9 ? under : above;
      }

      function linePoints(series) {
        var p = [];
        for (var i = 0; i < YEARS.length; i++) p.push(x(i) + ',' + y(series.r[i]));
        return p;
      }
      /* The line closed down to the baseline, which is what gets washed in. */
      function areaPoints(p) {
        return x(0) + ',' + y(0) + ' ' + p.join(' ') + ' ' + x(YEARS.length - 1) + ',' + y(0);
      }

      if (bars) return svg + barPlot() + years() + '</svg>';

      /* Every series has the ground under it washed in its own colour, at the
         same weight as the item's own. The fills all go down before any line,
         so no wash lands on top of a stroke; the taller ones go first, so a
         short band is not buried under a tall one. */
      var pts = linePoints(it);
      var order = [];
      for (var o = 0; o < extra.length; o++) order.push(o);
      order.sort(function (a, b) { return latest(extra[b]) - latest(extra[a]); });
      for (var f = 0; f < order.length; f++) {
        svg += '<polygon fill="' + cmpColor(order[f]) + '14" points="' + areaPoints(linePoints(extra[order[f]])) + '"/>';
      }
      svg += '<polygon class="chart-area" points="' + areaPoints(pts) + '"/>';
      svg += '<polyline class="chart-line" points="' + pts.join(' ') + '"/>';
      for (var e = 0; e < extra.length; e++) {
        var c = cmpColor(e), vpts = [];
        for (var v = 0; v < YEARS.length; v++) vpts.push(x(v) + ',' + y(extra[e].r[v]));
        svg += '<polyline class="chart-line-b" stroke="' + c + '" points="' + vpts.join(' ') + '"/>';
        for (var w = 0; w < YEARS.length; w++) {
          svg += '<circle class="chart-dot-b" stroke="' + c + '" cx="' + x(w) + '" cy="' + y(extra[e].r[w]) + '" r="4.5"/>';
          /* One comparison can carry its readings; several cannot, since the
             numbers would sit on each other, so past the first the lines are
             read off the axis. */
          if (extra.length === 1) {
            svg += '<text class="chart-value-b" fill="' + c + '" x="' + x(w) + '" y="' + labelY(extra[e].r[w], vsBelow[w]) + '">' + extra[e].r[w] + '%</text>';
          }
        }
      }
      for (var i = 0; i < YEARS.length; i++) {
        svg += '<circle class="chart-dot" cx="' + x(i) + '" cy="' + y(it.r[i]) + '" r="4.5"/>'
          + '<text class="chart-value" x="' + x(i) + '" y="' + labelY(it.r[i], itBelow[i]) + '">' + it.r[i] + '%</text>';
      }
      return svg + years() + '</svg>';

      /* The year under each point or band, the one part both plots share. */
      function years() {
        var out = '';
        for (var i = 0; i < YEARS.length; i++) {
          out += '<text class="chart-xlabel" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(YEARS[i]) + '</text>';
        }
        return out;
      }

      /* One group of bars per snapshot, the series side by side in the order of
         the key, so a name keeps its place in every group. Every bar carries its
         reading: three of them still leave a column wide enough for "100%". */
      function barPlot() {
        var series = [it].concat(extra);
        var groupW = band * 0.78, bw = groupW / series.length, out = '';
        for (var i = 0; i < YEARS.length; i++) {
          var left = x(i) - groupW / 2;
          for (var j = 0; j < series.length; j++) {
            var v = series[j].r[i], bx = left + bw * j, bt = y(v);
            out += '<rect class="chart-bar" fill="' + (j ? cmpColor(j - 1) : LINE_COLOR) + '"'
              + ' x="' + bx + '" y="' + bt + '" width="' + Math.max(bw - 2, 1) + '" height="'
              + Math.max(T + ph - bt, 0) + '" rx="2"/>';
            /* The reading goes over the bar, unless the bar reaches too near
               the top of the plot for it to fit; then it is written inside the
               bar in white, where the colour under it cannot swallow it.
               chart-value-b, not chart-value: the latter fixes its fill in the
               stylesheet, which would override the colour set here. */
            var inside = bt - 6 < T + 9;
            out += '<text class="chart-value-b" fill="' + (inside ? '#fff' : (j ? cmpColor(j - 1) : LINE_COLOR)) + '"'
              + ' x="' + (bx + (bw - 2) / 2) + '" y="' + (inside ? bt + 14 : bt - 6) + '">' + v + '%</text>';
          }
        }
        return out;
      }
    }


    /* Ranking position -------------------------------------------------------
       Where a name stands among the names of its own kind, one position per
       snapshot. The positions come off the counts rather than the rounded
       ratios: two names that both read 12% are not tied, and the counts say
       which of them is ahead. Worked out once, on the first item page opened,
       since the home page never asks for it. */
    var RANKS = null;
    function ranks() {
      if (RANKS) return RANKS;
      RANKS = [];
      var groups = {}, i;
      for (i = 0; i < ITEMS.length; i++) {
        RANKS.push([]);
        (groups[ITEMS[i].k] = groups[ITEMS[i].k] || []).push(i);
      }
      for (var kind in groups) {
        var list = groups[kind];
        for (var y = 0; y < YEARS.length; y++) {
          var at = y;
          var order = list.slice().sort(function (a, b) {
            return ITEMS[b].f[at] - ITEMS[a].f[at] || ITEMS[a].n.localeCompare(ITEMS[b].n);
          });
          /* A name no repository carried that year holds no position, which is
             a gap in the line rather than a place at the bottom of it. */
          for (var p = 0; p < order.length; p++) RANKS[order[p]][at] = ITEMS[order[p]].f[at] ? p + 1 : 0;
        }
      }
      return RANKS;
    }

    function rankSeries(it) { return ranks()[ITEMS.indexOf(it)] || []; }

    /* The position is a place among the names this table carries, not among
       every name on GitHub, so the note says how long the ranking is. */
    function rankNote(it) {
      var n = 0;
      for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].k === it.k) n++;
      return 'among ' + n + ' ' + (KIND_PLURAL[it.k] || it.k).toLowerCase();
    }

    /* The axis reaches a round number at or past the worst position drawn, so
       the lowest point never sits on the frame. */
    function rankTop(worst) {
      var tops = [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
      for (var i = 0; i < tops.length; i++) if (tops[i] >= worst) return tops[i];
      return worst;
    }

    /* The second chart on an item page. It plots position, not share, so a name
       that holds its ground while everything around it grows still falls here.
       Only ever a line: the axis runs from first place downwards, and bars hung
       from that edge would read upside down. */
    function rankChart(it, vs) {
      var extra = vs || [];
      var W = 440, L = 46, R = 24, B = 40, ph = 140;
      var series = [it].concat(extra), rows = [];
      for (var s = 0; s < series.length; s++) rows.push(rankSeries(series[s]));

      var keyed = extra.length ? series : [];
      var keyRows = keyLayout(keyed, W - R);
      /* Without a key there is nothing above the plot, so the top margin is only
         enough room for the first-place label to sit clear of the frame. */
      var T = keyed.length ? 16 * keyRows.length + 12 : 16;
      var H = T + ph + B;
      var pw = W - L - R;

      var worst = 1;
      for (var a = 0; a < rows.length; a++) {
        for (var b = 0; b < rows[a].length; b++) worst = Math.max(worst, rows[a][b]);
      }
      var top = rankTop(worst);
      var x = function (i) { return L + (YEARS.length === 1 ? pw / 2 : pw * i / (YEARS.length - 1)); };
      /* First place sits at the top of the plot and the axis counts downwards,
         the way a ranking is read. */
      var y = function (v) { return T + ph * (v - 1) / (top - 1); };

      /* Kept for the accessible label: the best position the line reaches. */
      var own = rows[0], from = own[0], now = own[own.length - 1];

      var label = (extra.length
        ? it.n + ' against ' + series.slice(1).map(function (e) { return e.n; }).join(', ')
        : it.n) + ', ranking position over time, best #' + (now || from || top)
        + ', axis to #' + top;
      var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">';
      if (keyed.length) {
        for (var kr = 0; kr < keyRows.length; kr++) {
          var kx = 0;
          for (var kc = 0; kc < keyRows[kr].length; kc++) {
            var ent = keyRows[kr][kc];
            svg += chartKey(kx, 14 + 16 * kr, ent.i === 0 ? null : cmpColor(ent.i - 1), ent.n);
            kx += ent.w + KEY_GAP;
          }
        }
      }

      /* Five gridlines, the first of them first place itself, so the top of the
         plot is a position and not an empty margin. */
      for (var g = 0; g <= 4; g++) {
        var gv = Math.round(1 + (top - 1) * g / 4);
        svg += '<line class="chart-grid" x1="' + L + '" y1="' + y(gv) + '" x2="' + (W - R) + '" y2="' + y(gv) + '"/>'
          + '<text class="chart-axis" x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" text-anchor="end">#' + gv + '</text>';
      }

      /* A gap in the ranking breaks the line rather than dropping it to the
         floor, so the years a name did not exist are drawn as nothing. */
      function segments(r) {
        var segs = [], cur = [];
        for (var i = 0; i < YEARS.length; i++) {
          if (r[i]) cur.push(x(i) + ',' + y(r[i]));
          else if (cur.length) { segs.push(cur); cur = []; }
        }
        if (cur.length) segs.push(cur);
        return segs;
      }

      /* Every line and its points first, the item's own last so it is the one on
         top where two names hold neighbouring positions. */
      for (var e = extra.length; e >= 0; e--) {
        var color = e ? cmpColor(e - 1) : null, r = rows[e], segs = segments(r);
        for (var sg2 = 0; sg2 < segs.length; sg2++) {
          if (segs[sg2].length < 2) continue;
          svg += color
            ? '<polyline class="chart-line-b" stroke="' + color + '" points="' + segs[sg2].join(' ') + '"/>'
            : '<polyline class="chart-line" points="' + segs[sg2].join(' ') + '"/>';
        }
        for (var i2 = 0; i2 < YEARS.length; i2++) {
          if (!r[i2]) continue;
          svg += color
            ? '<circle class="chart-dot-b" stroke="' + color + '" cx="' + x(i2) + '" cy="' + y(r[i2]) + '" r="4.5"/>'
            : '<circle class="chart-dot" cx="' + x(i2) + '" cy="' + y(r[i2]) + '" r="4.5"/>';
        }
      }

      /* Then the readings, a column at a time. On this axis three names can hold
         neighbouring positions a pixel apart, so a column's labels are stacked
         clear of one another instead of each being written over its own point:
         they start above their points, are pushed down until they no longer
         touch, and the column is lifted again if that ran it into the years. */
      var LBL_GAP = 12, LBL_TOP = T + 9, LBL_BOT = T + ph + 18;
      for (var col = 0; col < YEARS.length; col++) {
        var here = [];
        for (var s2 = 0; s2 <= extra.length; s2++) {
          if (!rows[s2][col]) continue;
          here.push({ y: y(rows[s2][col]), t: '#' + rows[s2][col], c: s2 ? cmpColor(s2 - 1) : null });
        }
        here.sort(function (a, b) { return a.y - b.y; });
        for (var q = 0; q < here.length; q++) {
          /* A point near the top of the plot has no room above it. */
          here[q].p = here[q].y - 11 < LBL_TOP ? here[q].y + 18 : here[q].y - 11;
          if (q && here[q].p - here[q - 1].p < LBL_GAP) here[q].p = here[q - 1].p + LBL_GAP;
        }
        if (here.length && here[here.length - 1].p > LBL_BOT) {
          here[here.length - 1].p = LBL_BOT;
          for (var u = here.length - 2; u >= 0; u--) {
            if (here[u + 1].p - here[u].p < LBL_GAP) here[u].p = here[u + 1].p - LBL_GAP;
          }
        }
        for (var w2 = 0; w2 < here.length; w2++) {
          var py = Math.min(LBL_BOT, Math.max(LBL_TOP, here[w2].p));
          svg += here[w2].c
            ? '<text class="chart-value-b" fill="' + here[w2].c + '" x="' + x(col) + '" y="' + py + '">' + here[w2].t + '</text>'
            : '<text class="chart-value" x="' + x(col) + '" y="' + py + '">' + here[w2].t + '</text>';
        }
      }

      for (var yl = 0; yl < YEARS.length; yl++) {
        svg += '<text class="chart-xlabel" x="' + x(yl) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(YEARS[yl]) + '</text>';
      }
      return svg + '</svg>';
    }

    /* One key row: a dot in the series' own colour, then the name. A dot takes
       half the width of a rule, which is width the names can use instead. A null
       colour is the item's own series. */
    function chartKey(kx, ky, color, name) {
      return '<circle fill="' + (color || LINE_COLOR) + '" cx="' + (kx + 4) + '" cy="' + (ky - 4) + '" r="4"/>'
        + '<text class="chart-key" x="' + (kx + KEY_MARK) + '" y="' + ky + '">' + esc(name) + '</text>';
    }

    /* The key is laid out by hand, since SVG text does not wrap: an entry is the
       8px dot, a gap, and the name at roughly 6.2px a character in the 11px key
       font. Entries fill the row and start a new one only when the next will not
       fit, so two or three short names stay on one line. */
    var KEY_MARK = 13, KEY_GAP = 16, KEY_CHAR = 6.2, KEY_MAX_CHARS = 22;
    function keyLayout(keyed, width) {
      var rows = [], line = [], used = 0;
      for (var i = 0; i < keyed.length; i++) {
        var n = keyed[i].n;
        if (n.length > KEY_MAX_CHARS) n = n.slice(0, KEY_MAX_CHARS - 1) + '\u2026';
        var w = KEY_MARK + n.length * KEY_CHAR;
        if (line.length && used + KEY_GAP + w > width) { rows.push(line); line = []; used = 0; }
        line.push({ n: n, w: w, i: i });
        used += (used ? KEY_GAP : 0) + w;
      }
      if (line.length) rows.push(line);
      return rows;
    }

    /* Up to two comparisons, three lines with the item's own, each in its own
       colour, well apart from the blue the item is drawn in. */
    var CMP_MAX = 2;
    var CMP_COLORS = ['#bf3989', '#8250df'];
    var LINE_COLOR = '#0969da';  // the item's own series, matching .chart-line
    function cmpColor(i) { return CMP_COLORS[i % CMP_COLORS.length]; }

    /* A snapshot per column, reading left to right in time like the charts above
       it, the three readings on one line: the count, what share of the
       repositories that was, and the position those put the name in. Everything
       both charts draw, in the numbers they were drawn from. */
    /* A line per series, named in the colour its line or bars are drawn in, so
       the table and the chart above it are read as one. */
    function table(it, vs) {
      var series = [it].concat(vs || []);
      var head = '<tr><th></th>';
      for (var i = 0; i < YEARS.length; i++) head += '<th>' + esc(YEARS[i]) + '</th>';
      var body = '';
      for (var j = 0; j < series.length; j++) {
        var color = j ? cmpColor(j - 1) : LINE_COLOR;
        var place = rankSeries(series[j]);
        body += '<tr><td class="evo-name" style="color:' + color + '">' + esc(series[j].n) + '</td>';
        for (var y = 0; y < YEARS.length; y++) {
          /* No repository carried the name that year, so there is no position to
             give: a dash, the way the chart leaves a gap. */
          body += '<td>' + series[j].f[y] + ' <span class="evo-pct">' + series[j].r[y] + '%</span>'
            + ' <span class="evo-rank">' + (place[y] ? '#' + place[y] : '\u2014') + '</span></td>';
        }
        body += '</tr>';
      }
      return '<table class="evo">' + head + '</tr>' + body + '</table>';
    }

    /* Opening an item is a navigation: it pushes a history entry, so Back returns
       to the home page and the browser's own buttons work. */
    function show(it) {
      navigate(detailUrl(it, []));
      renderDetail(it, []);
    }

    /* An extension says how many repositories carry it at all; which names do the
       carrying is a different question, so its page ranks its own files too. */
    /* The files a test picks out, ranked by ratio today, as indices into ITEMS. */
    function filesWhere(pred) {
      var rows = [];
      for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].k === 'file' && pred(ITEMS[i])) rows.push(i);
      rows.sort(function (a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); });
      return rows;
    }

    function extensionFiles(ext) {
      var suffix = ext.toLowerCase();
      return filesWhere(function (f) {
        var n = f.n.toLowerCase();
        return n.length > suffix.length && n.slice(-suffix.length) === suffix;
      });
    }

    /* A file page ends with the names it sits among: the top ten of its own
       extension, exactly as the extension page ranks them, the file itself
       included so its place among them can be read off.

       Two kinds of name have no extension to be grouped by, and each is a group
       in its own right: a dotfile (.gitignore), whose leading dot is a mark of
       the name rather than a suffix, and a bare name (LICENSE, Makefile). A
       dotted name that also carries a suffix (.travis.yml) belongs with its
       suffix, so the extension is tested first. */
    function fileGroup(name) {
      var dot = name.lastIndexOf('.');
      if (dot > 0) {
        var ext = name.slice(dot).toLowerCase();
        return { rows: extensionFiles(ext), label: '<span class="ext">' + esc(ext) + '</span> files' };
      }
      if (dot === 0) {
        return {
          rows: filesWhere(function (f) { return f.n.lastIndexOf('.') === 0; }),
          label: 'dotfiles'
        };
      }
      return {
        rows: filesWhere(function (f) { return f.n.indexOf('.') < 0; }),
        label: 'files with no extension'
      };
    }

    function relatedField(it) {
      if (it.k !== 'file') return '';
      var group = fileGroup(it.n), rows = group.rows;
      if (rows.length < 2) return '';

      var top = rows.slice(0, TOP_N);
      var html = '<div class="field"><div class="field-head">'
        + '<h2 class="field-label">Top ' + top.length + ' ' + group.label + '</h2>'
        + '<span class="top-count">of ' + rows.length + '</span></div><ol class="rank">';
      for (var o = 0; o < top.length; o++) html += rankRow(o + 1, top[o]);
      return html + '</ol></div>';
    }

    /* Ten is enough to read at a glance; the rest are the same ranking further
       down, so they are drawn like the first ten and hidden behind a toggle. */
    function filesField(it) {
      if (it.k !== 'extension') return '';
      var rows = extensionFiles(it.n);
      if (!rows.length) return '';
      var top = rows.slice(0, TOP_N), rest = rows.slice(TOP_N);
      var html = '<div class="field"><div class="field-head">'
        + '<h2 class="field-label">Top ' + top.length + ' <span class="ext">' + esc(it.n) + '</span> files</h2>'
        + '<span class="top-count">of ' + rows.length + '</span></div>'
        + '<ol class="rank"' + posWidth(rows.length) + '>';
      for (var i = 0; i < top.length; i++) html += rankRow(i + 1, top[i]);
      html += '</ol>';
      if (rest.length) {
        html += '<ol class="rank files-more" start="' + (TOP_N + 1) + '"'
          + ' style="display:none;--pos:' + Math.max(18, 4 + String(rows.length).length * 7) + 'px">';
        for (var j = 0; j < rest.length; j++) html += rankRow(TOP_N + j + 1, rest[j]);
        html += '</ol><div class="top-all"><button class="top-toggle files-toggle">Show top '
          + rows.length + '</button></div>';
      }
      return html + '</div>';
    }

    /* Compare picker ----------------------------------------------------------
       The picker and the charts under it are two halves of one choice, so all of
       them are redrawn whenever the comparison changes: a chip while a name is
       being compared, the search box again once it is removed. */
    function drawCompare() {
      document.getElementById('cChart').innerHTML = chart(current, compares, fitAxis, barChart);
      document.getElementById('cRank').innerHTML = rankChart(current, compares);
      document.getElementById('cTable').innerHTML = table(current, compares);
      var scale = document.getElementById('cScale');
      scale.textContent = fitAxis ? 'Show 0-100%' : 'Fit to data';
      scale.setAttribute('aria-pressed', fitAxis ? 'true' : 'false');
      var type = document.getElementById('cType');
      /* Each button says what a click gives, not what is drawn. */
      type.textContent = barChart ? 'Line chart' : 'Bar chart';
      type.setAttribute('aria-pressed', barChart ? 'true' : 'false');
      var row = document.getElementById('cmpRow'), html = '';
      for (var i = 0; i < compares.length; i++) {
        var c = cmpColor(i);
        html += '<span class="cmp-chip" style="color:' + c + ';background:' + c + '14">'
          + '<span class="cmp-name">' + esc(compares[i].n) + '</span>'
          + '<button type="button" data-cmp="' + i + '"'
          + ' aria-label="Remove ' + esc(compares[i].n) + ' from the chart">\u00d7</button></span>';
      }
      /* The box goes away once the chart is full: three lines is as much as the
         key and the plot stay readable with. */
      if (compares.length < CMP_MAX) {
        html += '<input type="text" id="cmpInput" autocomplete="off" placeholder="'
          + (compares.length ? 'Compare...' : 'Compare with another file, dir, or extension') + '">';
      }
      row.innerHTML = html;

      var drops = row.querySelectorAll('.cmp-chip button');
      for (var d = 0; d < drops.length; d++) {
        drops[d].addEventListener('click', (function (btn) {
          return function () { removeCompare(parseInt(btn.dataset.cmp, 10)); };
        })(drops[d]));
      }
      var box = document.getElementById('cmpInput');
      if (box) wireCompare(box);
      closeCmp();
    }

    function addCompare(it) {
      if (!it || compares.length >= CMP_MAX || compares.indexOf(it) >= 0) return;
      /* Names are read against each other by height, which bars say plainly;
         the line is still a click away. */
      if (!compares.length) barChart = true;
      compares.push(it);
      commitCompare();
    }

    function removeCompare(i) {
      compares.splice(i, 1);
      commitCompare();
    }

    function commitCompare() {
      navigate(detailUrl(current, compares));
      drawCompare();
    }

    var cmpIdx = -1, cmpResults = [];

    function closeCmp() {
      var list = document.getElementById('cmpSg');
      if (list) { list.innerHTML = ''; list.classList.remove('open'); }
      cmpIdx = -1; cmpResults = [];
    }

    /* The same search as the home page, minus the names already on the chart. */
    function renderCmp(q) {
      var list = document.getElementById('cmpSg');
      var found = search(q).filter(function (x) { return x !== current && compares.indexOf(x) < 0; });
      cmpIdx = -1; cmpResults = found;
      if (!found.length) {
        if (q) {
          list.innerHTML = '<div class="sg-empty">No results for "' + esc(q) + '"</div>';
          list.classList.add('open');
        } else { list.innerHTML = ''; list.classList.remove('open'); }
        return;
      }
      var html = '';
      for (var i = 0; i < found.length; i++) html += suggestion(found[i], i, q);
      list.innerHTML = html;
      list.classList.add('open');
      var rows = list.querySelectorAll('.sg-item');
      for (var j = 0; j < rows.length; j++) {
        rows[j].addEventListener('click', (function (k) {
          return function () { addCompare(cmpResults[k]); };
        })(j));
      }
    }

    function wireCompare(box) {
      box.addEventListener('input', function () { renderCmp(box.value.trim()); });
      box.addEventListener('focus', function () { if (box.value.trim()) renderCmp(box.value.trim()); });
      box.addEventListener('keydown', function (e) {
        var items = document.getElementById('cmpSg').querySelectorAll('.sg-item');
        /* Escape closes the picker; the page-level handler would otherwise take
           it as leaving the item page. */
        if (e.key === 'Escape') { e.stopPropagation(); closeCmp(); return; }
        if (!items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); cmpIdx = Math.min(cmpIdx + 1, items.length - 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); cmpIdx = Math.max(cmpIdx - 1, 0); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          addCompare(cmpResults[cmpIdx < 0 ? 0 : cmpIdx]);
          return;
        } else return;
        for (var i = 0; i < items.length; i++) {
          if (i === cmpIdx) { items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' }); }
          else items[i].classList.remove('on');
        }
      });
    }

    function renderDetail(it, vs) {
      current = it;
      var asked = (vs || []).length;
      compares = (vs || []).filter(function (x) { return x && x !== it; }).slice(0, CMP_MAX);
      /* A page opened comparing opens as bars, whatever was last chosen. */
      if (compares.length) barChart = true;
      /* A link may name more than the chart takes; the address bar should say
         what is actually drawn. */
      if (asked > compares.length) {
        try { history.replaceState(null, '', detailUrl(it, compares)); } catch (e) { }
      }
      document.getElementById('cTitle').innerHTML = titleIcon(it) + esc(it.n);
      document.getElementById('cPill').innerHTML = pill(it.k);
      var body = document.getElementById('cBody');
      body.innerHTML =
        '<div class="cmp" id="cmp"><div class="cmp-row" id="cmpRow"></div>'
        + '<div class="sg-list" id="cmpSg"></div></div>'
        + '<div class="field"><div class="field-head"><div class="field-label">Repositories (%)</div>'
        + '<div class="field-actions">'
        + '<button type="button" class="scale-btn" id="cScale" aria-pressed="false"></button>'
        + '<button type="button" class="scale-btn" id="cType" aria-pressed="false"></button></div></div>'
        + '<div id="cChart"></div>'
        + '</div>'
        + '<div class="field"><div class="field-head"><div class="field-label">Ranking position</div>'
        + '<span class="top-count">' + esc(rankNote(it)) + '</span></div>'
        + '<div id="cRank"></div></div>'
        + '<div class="field"><div class="field-head"><div class="field-label">Summary (repos, ratio, rank)</div>'
        + '<span class="top-count">per year</span></div>'
        + '<div id="cTable"></div></div>'
        + filesField(it)
        + relatedField(it);
      document.getElementById('cScale').addEventListener('click', function () {
        fitAxis = !fitAxis;
        drawCompare();
      });
      document.getElementById('cType').addEventListener('click', function () {
        barChart = !barChart;
        drawCompare();
      });
      drawCompare();
      var links = body.querySelectorAll('.top-link');
      for (var li = 0; li < links.length; li++) {
        links[li].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i, 10)]); };
        })(links[li]));
      }
      var toggle = body.querySelector('.files-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var more = body.querySelector('.files-more');
          var collapsed = more.style.display === 'none';
          more.style.display = collapsed ? '' : 'none';
          toggle.textContent = collapsed ? 'Show top ' + TOP_N : 'Show top ' + (TOP_N + more.children.length);
        });
      }
      document.title = it.n + ' - GitHub File History';
      document.getElementById('home').hidden = true;
      document.getElementById('detail').hidden = false;
      document.body.classList.add('detail-view');
      sg.classList.remove('open');
      window.scrollTo(0, 0);
    }

    /* The whole of one kind, ranked by ratio today: the same rows as the home
       page's top tens, with nothing held back. It is a page in its own right,
       so it is reached by a path and shares the item page's frame. */
    var KIND_PLURAL = { file: 'Files', dir: 'Directories', extension: 'Extensions' };

    function showAll(kind) {
      /* The whole of one kind is Popular at the newest snapshot. */
      showList('popular', YEARS.length - 1, kind);
    }

    function showList(section, year, kind) {
      navigate(listUrl(section, year, kind));
      renderList(section, year, kind);
    }

    /* The page behind "See all": the same ranking the home page shows the first
       ten of, with nothing held back. It shares the item page's frame, so Back
       and the search box work the way they do everywhere else. */
    function renderList(section, year, kind) {
      var def = SECTIONS[section];
      /* A hand-written or stale URL should not draw an empty page. */
      if (!def || KINDS.indexOf(kind) < 0 || !YEARS[year]) { showHome(); return; }
      /* "biggest gain since today" is nothing at all: a year the section does
         not offer falls back to the one it opens on, so the picker below always
         has the year on show among its buttons. */
      if (year >= def.years().length) year = YEAR_START[section];
      current = null;
      compares = [];

      var groups = kindGroups();
      var rows = def.rank(groups[kind] || [], year), opt = def.row(year);
      var heading = def.mark + ' ' + def.title + ' ' + (KIND_PLURAL[kind] || kind);

      document.getElementById('cTitle').textContent = heading;
      /* No pill: the heading already says Files, Directories or Extensions, so
         a tag beside it would name the kind twice. */
      document.getElementById('cPill').innerHTML = '';
      var body = document.getElementById('cBody');
      /* The same heading the home page gives a section: what the ranking is
         measured against, then the year it is measured against, so a whole
         ranking is walked year by year here rather than only from the home
         page. */
      var html = '<div class="row-sub list-sub">' + sectionPicker(section) + kindPicker(kind)
        + '<span class="row-note">' + esc(def.note) + '</span>'
        + yearPicker(def.years(), year, section) + '</div>'
        + '<div class="field"><div class="field-head">'
        + '<div class="field-label">' + rows.length + ' names</div></div>';
      if (!rows.length) {
        html += '<p class="rank-none">nothing here</p>';
      } else {
        html += '<ol class="rank"' + posWidth(rows.length) + '>';
        for (var r = 0; r < rows.length; r++) html += rankRow(r + 1, rows[r], opt);
        html += '</ol>';
      }
      body.innerHTML = html + '</div>';

      var links = body.querySelectorAll('.top-link');
      for (var li = 0; li < links.length; li++) {
        links[li].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i, 10)]); };
        })(links[li]));
      }
      /* Picking a year or a kind redraws this page as asked, address bar and
         all, so a reader stays in the ranking they are reading. */
      var ybs = body.querySelectorAll('.year-btn');
      for (var yb = 0; yb < ybs.length; yb++) {
        ybs[yb].addEventListener('click', (function (btn) {
          return function () {
            var y = parseInt(btn.dataset.year, 10);
            if (y !== year) showList(section, y, kind);
          };
        })(ybs[yb]));
      }
      var kbs = body.querySelectorAll('.kind-btn');
      for (var kb = 0; kb < kbs.length; kb++) {
        kbs[kb].addEventListener('click', (function (btn) {
          return function () {
            var k = btn.dataset.kind;
            if (k !== kind) showList(section, year, k);
          };
        })(kbs[kb]));
      }
      /* A section keeps the kind and the year on show where it can: the year is
         put right by renderList when the section does not offer it, since
         "biggest gain since today" is nothing at all. */
      var sbs = body.querySelectorAll('.section-btn');
      for (var sb = 0; sb < sbs.length; sb++) {
        sbs[sb].addEventListener('click', (function (btn) {
          return function () {
            var sc = btn.dataset.section;
            if (sc !== section) showList(sc, year, kind);
          };
        })(sbs[sb]));
      }
      /* A link chopped back to <section>/<kind>, or the older all/<kind>, is
         rewritten to the year it resolved to, so the address bar says which
         one is on show and only one shape of URL is ever copied. */
      try { history.replaceState(null, '', listUrl(section, year, kind)); } catch (e) { }
      document.title = heading + ', ' + def.note + ' ' + YEARS[year] + ' - GitHub File History';
      document.getElementById('home').hidden = true;
      document.getElementById('detail').hidden = false;
      document.body.classList.add('detail-view');
      sg.classList.remove('open');
      window.scrollTo(0, 0);
    }

    function showHome() {
      current = null;
      document.getElementById('detail').hidden = true;
      document.getElementById('home').hidden = false;
      document.body.classList.remove('detail-view');
      document.title = HOME_TITLE;
    }

    function byName(name) {
      for (var i = 0; i < ITEMS.length; i++) {
        if (ITEMS[i].n.toLowerCase() === name.toLowerCase()) return ITEMS[i];
      }
      return null;
    }

    /* The path is the router. Old #<kind>#<name> links are still honoured, and are
       rewritten to the path form so only one shape of URL is ever shared. */
    function route() {
      var hash = location.hash.slice(1);
      if (hash) {
        var cut = hash.indexOf('#');
        var old = cut < 0 ? byName(decodeURIComponent(hash))
          : byKey(hash.slice(0, cut) + '#' + decodeURIComponent(hash.slice(cut + 1)));
        if (old) {
          try { history.replaceState(null, '', itemUrl(old)); } catch (e) { }
          renderDetail(old);
          return;
        }
      }
      var at = pathParts();
      if (at.view === 'list') { renderList(at.section, at.year, at.kind); return; }
      var it = at.view === 'item' ? byKey(at.kind + '#' + at.name) || byName(at.name) : null;
      if (it) renderDetail(it, vsFromQuery()); else showHome();
    }

    /* One vs=<kind>:<name> per extra series, each falling back to a bare name for
       a hand-written link. The slash form earlier links used is still read, so
       those keep working. Names that match nothing are dropped. */
    function vsFromQuery() {
      var re = /[?&]vs=([^&]*)/g, out = [], m;
      while ((m = re.exec(location.search))) {
        var raw = decodeURIComponent(m[1].replace(/\+/g, ' '));
        var cut = raw.search(/[:/]/);
        var it = (cut > 0 ? byKey(raw.slice(0, cut) + '#' + raw.slice(cut + 1)) : null) || byName(raw);
        if (it && out.indexOf(it) < 0) out.push(it);
      }
      return out;
    }

    function byKey(k) {
      for (var i = 0; i < ITEMS.length; i++) if (key(ITEMS[i]) === k) return ITEMS[i];
      return null;
    }

    /* Comparisons worth a look, each a name and the one or two it is read
       against. A pick naming something the data does not carry is dropped, so
       the row survives a rebuild that retires a name. */
    var PICKS = [
      ['file#AGENTS.md', 'file#CLAUDE.md'],
      ['extension#.js', 'extension#.ts'],
      ['dir#test', 'dir#tests'],
      ['extension#.java', 'extension#.kt'],
      ['file#setup.py', 'file#pyproject.toml'],
      ['extension#.yml', 'extension#.yaml'],
      ['dir#src', 'dir#lib', 'dir#app'],
      ['file#Dockerfile', 'file#docker-compose.yml'],
      ['dir#docs', 'dir#doc', 'dir#documentation'],
      ['extension#.png', 'extension#.svg', 'extension#.jpg'],
      ['file#.eslintrc.js', 'file#.eslintrc.json'],
      ['file#webpack.config.js', 'file#vite.config.ts'],
      ['file#README.md', 'file#readme.md', 'file#README.txt'],
      ['file#.travis.yml', 'dir#workflows', 'dir#.circleci'],
      ['file#LICENSE', 'file#LICENSE.md', 'file#LICENSE.txt'],
    ];

    var PICK_SETS = [];
    var PICKS_SHOWN = 3;  // a handful to try, not the whole list

    function showPicks() {
      var box = document.getElementById('picks');
      var ready = [];
      for (var p = 0; p < PICKS.length; p++) {
        var set = [], ok = true;
        for (var k = 0; k < PICKS[p].length; k++) {
          var it = byKey(PICKS[p][k]);
          if (!it) { ok = false; break; }
          set.push(it);
        }
        if (ok && set.length >= 2) ready.push(set);
      }

      /* A different handful each visit, so the whole list gets seen over time.
         Drawn without replacement, taking the tail of a partial shuffle. */
      for (var i = ready.length - 1; i > 0 && ready.length - i <= PICKS_SHOWN; i--) {
        var j = Math.floor(Math.random() * (i + 1)), swap = ready[i];
        ready[i] = ready[j];
        ready[j] = swap;
      }
      var sets = PICK_SETS = ready.slice(Math.max(0, ready.length - PICKS_SHOWN));

      var html = '';
      for (var q = 0; q < sets.length; q++) {
        var names = [];
        for (var n = 0; n < sets[q].length; n++) names.push(esc(sets[q][n].n));
        html += '<button type="button" class="top-toggle pick" data-p="' + q + '">'
          /* Non-breaking spaces, so the gap around the separator is kept
             whatever the markup does with ordinary whitespace. */
          + names.join('<span class="vs">\u00a0vs\u00a0</span>') + '</button>';
      }
      if (!sets.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="pick-list"><span class="pick-label">Tip:</span>' + html + '</div>';
      var btns = box.querySelectorAll('.pick');
      for (var b = 0; b < btns.length; b++) {
        btns[b].addEventListener('click', (function (set) {
          return function () {
            navigate(detailUrl(set[0], set.slice(1)));
            renderDetail(set[0], set.slice(1));
          };
        })(sets[parseInt(btns[b].dataset.p, 10)]));
      }
    }

    function showStats() {
      var counts = {};
      for (var i = 0; i < ITEMS.length; i++) counts[ITEMS[i].k] = (counts[ITEMS[i].k] || 0) + 1;
      var stats = [
        { n: counts.file || 0, l: 'Files', k: 'file' },
        { n: counts.dir || 0, l: 'Directories', k: 'dir' },
        { n: counts.extension || 0, l: 'Extensions', k: 'extension' }
      ];
      var html = '';
      for (var i = 0; i < stats.length; i++) {
        html += '<button type="button" class="stat" data-kind="' + stats[i].k + '">'
          + '<div class="stat-num stat-num-' + stats[i].k + '">' + stats[i].n + '</div>'
          + '<div class="stat-label">' + stats[i].l + '</div></button>';
      }
      var box = document.getElementById('stats');
      box.innerHTML = html;
      var tiles = box.querySelectorAll('.stat');
      for (var t = 0; t < tiles.length; t++) {
        tiles[t].addEventListener('click', (function (btn) {
          return function () { showAll(btn.dataset.kind); };
        })(tiles[t]));
      }
    }

    /* Each kind gets its top ten by ratio today, with the rest of its names behind
       a toggle: the long lists are useful but should not push the sections apart. */
    var TOP_N = 10;
    /* The years a section of movement can be measured against: every one but
       the newest, since comparing the newest with itself would leave nothing to
       rank. Popular offers all of them, so both pickers index into YEARS. */
    var MOVE_YEARS = YEARS.slice(0, -1);
    /* The year each section is drawn against, its own. Picking a year changes
       the section it was picked in and leaves the other three where they were,
       so two sections can be read against different years at once.
       The movement sections open on 2020, far enough back to have moved and
       recent enough that the names are still ones the reader knows; the oldest
       snapshot stands in where a data file does not carry that year. Popular
       opens on today. */
    var MOVE_START = Math.max(0, MOVE_YEARS.indexOf('2020'));
    var YEAR_START = {
      popular: YEARS.length - 1,
      new: MOVE_START,
      increasing: MOVE_START,
      decreasing: MOVE_START
    };
    var YEAR_AT = {
      popular: YEAR_START.popular,
      new: YEAR_START.new,
      increasing: YEAR_START.increasing,
      decreasing: YEAR_START.decreasing
    };

    /* One ranked row: the bar is the ratio at the year on show, so rows can be
       compared across sections even when the ranking itself is by something
       else. `opt` is the row's section: which year it is drawn at, whether the
       movement since another year is written beside it, and whether the kind
       needs naming (it does not, where a whole chart is one kind). */
    /* The width the position column needs for a list ending at this number. */
    function posWidth(max) {
      return ' style="--pos:' + Math.max(18, 4 + String(max).length * 7) + 'px"';
    }

    function rankRow(pos, i, opt) {
      opt = opt || {};
      var it = ITEMS[i], r = ratioAt(it, opt.at);
      return '<li><span class="rank-pos">' + pos + '</span>'
        + '<span class="rank-label">'
        + '<button class="top-link rank-name" data-i="' + i + '" title="' + esc(it.n) + '">' + esc(it.n) + '</button>'
        + (opt.pill ? pill(it.k) : '') + '</span>'
        + icon(it)
        + '<span class="rank-bar"><span class="rank-fill rank-fill-' + it.k + '" style="width:' + r + '%"></span></span>'
        + '<span class="rank-pct">' + r + '%</span>'
        /* Only the sections that rank by movement carry the change; under
           Popular the ratio is the ranking, so points and arrow would just be
           noise. */
        + (opt.move
          ? '<span class="rank-delta arw-' + direction(it, opt.from) + '">' + (delta(it, opt.from) > 0 ? '+' : '') + delta(it, opt.from) + '</span>'
          + '<span class="rank-arw">' + arrow(it, opt.from) + '</span>'
          : '')
        + '</li>';
    }

    /* The four rankings the home page is made of, in the order it draws them.
       Each says how to order the names of one kind at one year, and how a row of
       it is written; the home page shows the first ten of each and the page
       behind "See all" shows the lot, both from this one description.
       The keys are the first segment of the URL of that ranking. */
    var SECTION_ORDER = ['popular', 'new', 'increasing', 'decreasing'];
    var SECTIONS = {
      popular: {
        title: 'Popular',
        mark: '\u2b50',  /* star */
        note: 'most common in',
        /* Any snapshot can be ranked by ratio, so Popular offers all of them. */
        years: function () { return YEARS; },
        rank: function (list, y) {
          return list.slice().sort(function (a, b) {
            return ratioAt(ITEMS[b], y) - ratioAt(ITEMS[a], y) || ITEMS[a].n.localeCompare(ITEMS[b].n);
          });
        },
        row: function (y) { return { at: y }; }
      },
      /* New means new since the year being compared with: no repository had the
         name then, some do now. What it did before that does not matter, so a
         name that was around in 2015, vanished by 2020 and is back today counts
         as new against 2020. */
      new: {
        title: 'New',
        mark: '\u2728',  /* sparkles */
        note: 'absent in',
        years: function () { return MOVE_YEARS; },
        rank: function (list, y) {
          return list.filter(function (i) {
            var f = ITEMS[i].f;
            return f[y] === 0 && f[f.length - 1] > 0;
          }).sort(byGain(y));
        },
        row: function (y) { return { move: true, from: y }; }
      },
      increasing: {
        title: 'Increasing',
        mark: '\ud83d\udcc8',  /* chart increasing */
        note: 'biggest gain since',
        years: function () { return MOVE_YEARS; },
        rank: function (list, y) {
          return list.filter(function (i) { return delta(ITEMS[i], y) > 0; }).sort(byGain(y));
        },
        row: function (y) { return { move: true, from: y }; }
      },
      decreasing: {
        title: 'Decreasing',
        mark: '\ud83d\udcc9',  /* chart decreasing */
        note: 'biggest drop since',
        years: function () { return MOVE_YEARS; },
        rank: function (list, y) {
          return list.filter(function (i) { return delta(ITEMS[i], y) < 0; }).sort(byDrop(y));
        },
        row: function (y) { return { move: true, from: y }; }
      }
    };

    /* The movement sections rank by how much the ratio moved in points since
       their year, so their bars do not descend the way Popular's do. A name that
       is new moved by its whole ratio, which is why that one still looks sorted
       by %. Each sort is made for one section's year, since the four do not
       share one. */
    function byGain(from) {
      return function (a, b) { return delta(ITEMS[b], from) - delta(ITEMS[a], from) || ITEMS[a].n.localeCompare(ITEMS[b].n); };
    }
    function byDrop(from) {
      return function (a, b) { return delta(ITEMS[a], from) - delta(ITEMS[b], from) || ITEMS[a].n.localeCompare(ITEMS[b].n); };
    }

    /* The indices of every name of one kind, worked out once a page. */
    function kindGroups() {
      var groups = {};
      for (var i = 0; i < ITEMS.length; i++) {
        (groups[ITEMS[i].k] = groups[ITEMS[i].k] || []).push(i);
      }
      return groups;
    }

    /* One chart of a section: the first ten of the ranking for a single kind,
       headed by the kind in full — Files, Directories, Extensions — since it
       names a whole ranking here rather than tagging a single row the way the
       pills elsewhere do. The rest of the ranking is a page of its own. */
    function rankChartOf(kind, rows, opt, seeAll) {
      var html = '<div class="top-group" data-kind="' + esc(kind) + '">'
        + '<div class="top-group-title"><h3 class="top-group-name pill-' + kind + '">'
        + esc(KIND_PLURAL[kind] || kind) + '</h3>'
        + '<span class="top-count">' + rows.length + '</span></div>';
      if (!rows.length) return html + '<p class="rank-none">nothing here</p></div>';
      var top = rows.slice(0, TOP_N);
      html += '<ol class="rank"' + posWidth(rows.length) + '>';
      for (var i = 0; i < top.length; i++) html += rankRow(i + 1, top[i], opt);
      html += '</ol>';
      /* The rest of the ranking is behind a link rather than a toggle: a
         hundred rows in a column of three is a page, so it is given one. */
      if (rows.length > top.length) {
        html += '<div class="top-all"><a class="top-toggle see-all" href="' + seeAll + '">See all</a></div>';
      }
      return html + '</div>';
    }

    /* One section of the home page: a heading that says what the ranking is and
       against which year, then that same ranking drawn once per kind. */
    function rankSection(scope, groups) {
      var def = SECTIONS[scope], y = YEAR_AT[scope], opt = def.row(y);
      /* The mark is decoration: the title says the same thing in words, so a
         screen reader is spared reading it out. */
      var html = '<div class="row-head"><h2 class="row-title">'
        + '<span class="row-mark" aria-hidden="true">' + def.mark + '</span>'
        + esc(def.title) + '</h2>'
        /* The title has a line to itself; what the ranking is measured against
           reads as one sentence on the lines under it. */
        + '<div class="row-sub"><span class="row-note">' + esc(def.note) + '</span>'
        + yearPicker(def.years(), y, scope) + '</div></div>';
      for (var ki = 0; ki < KINDS.length; ki++) {
        var kind = KINDS[ki];
        html += rankChartOf(kind, def.rank(groups[kind] || [], y), opt, listUrl(scope, y, kind));
      }
      return html;
    }

    /* Which ranking a "See all" page is drawn for: the four the home page is
       made of, in the order it draws them, so a reader moves between them
       without going back for the one they want. */
    function sectionPicker(cur) {
      var html = '<div class="year-pick section-pick">';
      for (var i = 0; i < SECTION_ORDER.length; i++) {
        var sc = SECTION_ORDER[i], on = sc === cur;
        html += '<button class="top-toggle section-btn' + (on ? ' on' : '') + '" data-section="' + esc(sc)
          + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
          /* The mark is decoration: the title beside it says the same thing. */
          + '<span class="row-mark" aria-hidden="true">' + SECTIONS[sc].mark + '</span>'
          + esc(SECTIONS[sc].title) + '</button>';
      }
      return html + '</div>';
    }

    /* Which of the three a "See all" page is drawn for. The home page splits a
       section into three charts side by side; a page has room for one ranking
       at a time, so the kind is picked the way the year is. */
    function kindPicker(cur) {
      var html = '<div class="year-pick kind-pick">';
      for (var i = 0; i < KINDS.length; i++) {
        var on = KINDS[i] === cur;
        html += '<button class="top-toggle kind-btn' + (on ? ' on' : '') + '" data-kind="' + esc(KINDS[i])
          + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
          + esc(KIND_PLURAL[KINDS[i]] || KINDS[i]) + '</button>';
      }
      return html + '</div>';
    }

    /* The year a section is drawn against. Its three charts all read the same
       year, so the choice sits in the heading rather than inside each chart. */
    function yearPicker(years, cur, scope) {
      var html = '<div class="year-pick">';
      for (var i = 0; i < years.length; i++) {
        var on = i === cur;
        html += '<button class="top-toggle year-btn' + (on ? ' on' : '') + '" data-scope="' + scope
          + '" data-year="' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
          + esc(years[i]) + '</button>';
      }
      return html + '</div>';
    }

    function showTop() {
      var groups = kindGroups(), html = '';
      for (var si = 0; si < SECTION_ORDER.length; si++) {
        if (si) html += '<div class="row-rule"></div>';
        html += rankSection(SECTION_ORDER[si], groups);
      }

      var tl = document.getElementById('top-list');
      tl.innerHTML = html;
      var links = tl.querySelectorAll('.top-link');
      for (var bi = 0; bi < links.length; bi++) {
        links[bi].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i)]); };
        })(links[bi]));
      }
      var years = tl.querySelectorAll('.year-btn');
      for (var yi = 0; yi < years.length; yi++) {
        years[yi].addEventListener('click', (function (btn) {
          return function () {
            var scope = btn.dataset.scope, y = parseInt(btn.dataset.year);
            if (y === YEAR_AT[scope]) return;
            YEAR_AT[scope] = y;
            showTop();
          };
        })(years[yi]));
      }
      /* A real link, so it can be opened in a new tab or copied; the handler
         only saves the reload when it is followed in place. */
      var alls = tl.querySelectorAll('.see-all');
      for (var ai = 0; ai < alls.length; ai++) {
        alls[ai].addEventListener('click', (function (a) {
          return function (e) {
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
            e.preventDefault();
            navigate(a.getAttribute('href'));
            route();
          };
        })(alls[ai]));
      }
    }

    /* Back walks the history when this page was reached from the home page, and
       otherwise goes to the base URL, which is the home page. */
    function goBack() {
      if (history.length > 1 && document.referrer !== '') { history.back(); return; }
      navigate(BASE);
      route();
    }

    document.getElementById('dBack').addEventListener('click', goBack);
    document.getElementById('cShare').addEventListener('click', function () {
      navigator.clipboard.writeText(location.href).then(function () {
        var btn = document.getElementById('cShare');
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"/></svg>Copy link'; }, 1500);
      });
    });
    window.addEventListener('popstate', route);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('detail').hidden) goBack();
    });

    input.addEventListener('input', function () { var q = input.value.trim(); render(search(q), q); });
    input.addEventListener('keydown', function (e) {
      var items = sg.querySelectorAll('.sg-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); hi(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); hi(items); }
      else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); show(results[idx]); sg.classList.remove('open'); }
      else if (e.key === 'Escape') sg.classList.remove('open');
    });

    function hi(items) {
      for (var i = 0; i < items.length; i++) {
        if (i === idx) { items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' }); }
        else items[i].classList.remove('on');
      }
    }

    document.addEventListener('click', function (e) {
      if (!document.getElementById('sw').contains(e.target)) sg.classList.remove('open');
      var cmp = document.getElementById('cmp');
      if (cmp && !cmp.contains(e.target)) closeCmp();
    });

    /* Hover preview -----------------------------------------------------------
       Ranked rows and the ready-made comparisons preview: a suggestion list is
       already a hover target being read top to bottom, and a chart following the
       pointer there would sit on top of the next suggestion. */
    var tip = document.getElementById('tip');

    function hoveredItem(el) {
      var row = el.closest ? el.closest('[data-i]') : null;
      if (!row || row.classList.contains('sg-item')) return null;
      return ITEMS[parseInt(row.dataset.i, 10)] || null;
    }

    function placeTip(x, y) {
      var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + pad, top = y + pad;
      if (left + w > window.innerWidth - 8) left = x - pad - w;
      if (top + h > window.innerHeight - 8) top = Math.max(8, y - pad - h);
      tip.style.left = Math.max(8, left) + 'px';
      tip.style.top = top + 'px';
    }

    function hideTip() { tip.hidden = true; }

    document.addEventListener('mouseover', function (e) {
      /* A pick previews the whole comparison it opens, drawn the way the page
         behind it would draw it: bars, since that is how a comparison opens. */
      var btn = e.target.closest ? e.target.closest('.pick') : null;
      if (btn) {
        var set = PICK_SETS[parseInt(btn.dataset.p, 10)];
        if (set) {
          if (tip.dataset.k !== 'pick' + btn.dataset.p) {
            tip.dataset.k = 'pick' + btn.dataset.p;
            tip.innerHTML = chart(set[0], set.slice(1), fitAxis, true);
          }
          tip.hidden = false;
          placeTip(e.clientX, e.clientY);
          return;
        }
      }
      var it = hoveredItem(e.target);
      if (!it) { hideTip(); return; }
      if (tip.dataset.k !== key(it)) {
        tip.dataset.k = key(it);
        tip.innerHTML = '<div class="tip-name">' + titleIcon(it) + '<span class="n">' + esc(it.n) + '</span>' + pill(it.k) + '</div>' + chart(it);
      }
      tip.hidden = false;
      placeTip(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', function (e) {
      if (!tip.hidden) placeTip(e.clientX, e.clientY);
    });

    window.addEventListener('scroll', hideTip, true);
    document.addEventListener('click', hideTip);

    showStats();
    showPicks();
    showTop();
    route();
    if (document.getElementById('detail').hidden) input.focus();
  </script>
</body>

</html>
