<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>file-history - GitHub File History</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }

    /* The hero reads better narrow than the page is wide, so its content keeps
       the old width and stays centred. */
    .hero-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(180deg, #f0f6ff 0%, #ffffff 100%);
      /* The counts sit between two rules; the bottom padding matches the space
         .stats keeps above itself, so they are the same distance from each. */
      padding: 60px 20px 24px;
      border-bottom: 1px solid #e8edf5;
    }

    .page h1 {
      font-size: 1.7rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #656d76;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Search */
    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-wrap input {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      outline: none;
      -webkit-appearance: none;
    }

    .search-wrap input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
    }

    .search-wrap input::placeholder {
      color: #8b949e;
    }

    /* Suggestions */
    .sg-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      -webkit-overflow-scrolling: touch;
    }

    .sg-list.open {
      display: block;
    }

    .sg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      cursor: pointer;
      gap: 8px;
    }

    .sg-item:not(:last-child) {
      border-bottom: 1px solid #eef0f2;
    }

    .sg-item:hover,
    .sg-item.on {
      background: #f6f8fa;
    }

    .sg-item-left {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 6px;
    }

    /* The row is spaced apart, so the icon would otherwise float in the middle;
       this pushes it against the pill at the right end. */
    .sg-item .ico {
      margin-left: auto;
    }

    .sg-name {
      font-weight: 500;
      font-size: 0.95rem;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .sg-hint {
      color: #8b949e;
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sg-empty {
      padding: 10px 14px;
      color: #8b949e;
      font-size: 0.875rem;
    }

    .pill {
      font-size: 0.73rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill-file {
      background: #ddf4ff;
      color: #0969da;
    }

    .pill-dir {
      background: #dafbe1;
      color: #1a7f37;
    }

    .pill-extension {
      background: #fff8c5;
      color: #9a6700;
    }

    /* Hover preview: the same chart the item page shows, small and following
       the pointer. It never takes the pointer, so moving onto it cannot happen
       and the row underneath keeps its hover. */
    #tip {
      position: fixed;
      z-index: 200;
      width: 320px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 10px 12px 6px;
      pointer-events: none;
    }

    #tip .tip-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    #tip .tip-name span.n {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (hover: none) {
      #tip {
        display: none !important;
      }
    }

    /* On an item page the hero keeps the repo link, the title and the subtitle;
       the search box and stats belong to the home page. */
    body.detail-view .search-wrap,
    body.detail-view .stats {
      display: none;
    }

    body.detail-view .hero {
      padding: 36px 20px 24px;
    }

    /* Detail view: a page of its own, shown in place of the home page. */
    .detail {
      padding: 28px 20px 40px;
      max-width: 620px;
      margin: 0 auto;
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef0f2;
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .detail-head h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* A control rather than a link: it is the one way out of an item page, so
       it takes the same pill shape as the page's other buttons and keeps its
       hit area on a touch screen. */
    .back {
      display: none;
      align-items: center;
      gap: 6px;
      /* Centred under the subtitle, like everything else in the header. */
      margin: 0 auto 16px;
      padding: 6px 12px 6px 9px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      color: #656d76;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    body.detail-view .back {
      display: flex;
      width: fit-content;
    }

    .back:hover {
      color: #24292f;
      border-color: #8b949e;
      background: #f6f8fa;
    }

    .back:active {
      background: #eef0f2;
    }

    .back:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    /* The arrow leads the way out, so it leans further out under the pointer. */
    .back svg {
      transition: transform 0.15s;
    }

    .back:hover svg {
      transform: translateX(-2px);
    }

    @media (prefers-reduced-motion: reduce) {

      .back,
      .back svg {
        transition: none;
      }
    }

    .card-share {
      background: none;
      border: none;
      font-size: 0.78rem;
      color: #656d76;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .card-share:hover {
      color: #24292f;
    }

    .card-body {
      padding: 4px 0 0;
    }

    .field {
      padding: 10px 0;
    }

    /* A section that follows a rule starts below it rather than against it. */
    .field+.field {
      border-top: 1px solid #eef0f2;
      padding-top: 20px;
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #656d76;
      margin-bottom: 6px;
    }

    /* A label with a control or a count on its right: the label keeps its
       spacing, the other half sits at the far end of the same row. Every
       section on an item page is headed this way. */
    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .field-head .field-label {
      margin-bottom: 6px;
    }

    h2.field-label {
      margin-top: 0;
    }

    /* An extension is a literal name, so it keeps its own case inside a label
       that is otherwise upper-cased. */
    .field-label .ext {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: none;
    }

    .field-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .scale-btn {
      background: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      color: #656d76;
      cursor: pointer;
      flex-shrink: 0;
    }

    .scale-btn:hover {
      color: #24292f;
      border-color: #8b949e;
    }

    /* Ready-made comparisons: a way into the chart for a reader who has not
       thought of two names to put side by side yet. */
    /* Matches the element's id: the row is #picks, not a class. */
    #picks {
      /* The hero's rule runs right above this row, so it needs room to breathe
         under the line rather than sitting on it, and a rule of its own closes
         the row off from the rankings below. */
      padding: 22px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #e8edf5;
    }

    /* Twenty of these, so they are packed tight and held to a readable measure
       rather than running the width of the page. */
    .pick-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Both classes, since the toggle's own rule comes later in this sheet and
       would otherwise win on source order. */
    .top-toggle.pick {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      padding: 4px 10px;
    }

    /* Names what the row is: a few comparisons worth opening. */
    .pick-label {
      align-self: center;
      color: #8b949e;
      font-size: 0.78rem;
    }

    /* The separator is scaffolding between two names, so it steps back. */
    .pick .vs {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8b949e;
      padding: 0 3px;
    }

    /* Chart */
    .chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-grid {
      stroke: #eef0f2;
      stroke-width: 1;
    }

    .chart-axis {
      fill: #8b949e;
      font-size: 11px;
    }

    .chart-xlabel {
      fill: #656d76;
      font-size: 12px;
      font-weight: 500;
    }

    .chart-line {
      fill: none;
      stroke: #0969da;
      stroke-width: 2.5;
    }

    /* Bars stand in for the line. Each carries its series' colour as a fill
       attribute, so the rule here must not set one: a stylesheet fill would win
       over the attribute and paint every bar the same. */
    .chart-bar {
      stroke: none;
    }

    .chart-area {
      fill: rgba(9, 105, 218, 0.08);
    }

    .chart-dot {
      fill: #fff;
      stroke: #0969da;
      stroke-width: 2.5;
    }

    .chart-value {
      fill: #0969da;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    /* The comparison series. Each takes its stroke from the palette in the
       script, so the lines are told apart by colour. */
    .chart-line-b {
      fill: none;
      stroke-width: 2.5;
    }

    .chart-dot-b {
      fill: #fff;
      stroke-width: 2.5;
    }

    .chart-value-b {
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    .chart-key {
      font-size: 11px;
      font-weight: 600;
      fill: #24292f;
    }

    .chart-trend {
      font-size: 13px;
      font-weight: 600;
    }

    .chart-trend-up {
      fill: #1a7f37;
    }

    .chart-trend-down {
      fill: #cf222e;
    }

    .chart-trend-flat {
      fill: #656d76;
    }

    /* The item page draws both charts at full width, where the lettering of the
       hover preview they share a stylesheet with comes out oversized; a size
       down leaves the readings clear of each other and of the bars. The two are
       read one under the other, so they are lettered alike. */
    #cChart .chart-value,
    #cChart .chart-value-b,
    #cRank .chart-value,
    #cRank .chart-value-b {
      font-size: 10px;
    }

    #cChart .chart-axis,
    #cRank .chart-axis {
      font-size: 9.5px;
    }

    #cChart .chart-xlabel,
    #cRank .chart-xlabel {
      font-size: 10.5px;
    }

    #cChart .chart-key,
    #cRank .chart-key {
      font-size: 10px;
    }

    #cChart .chart-trend,
    #cRank .chart-trend {
      font-size: 11.5px;
    }

    /* Compare picker: the same suggestion list as the home search, so it is
       driven the same way, sitting under the chart it changes. */
    /* The picker heads the page: the names it holds are drawn on every chart
       below it, so it is read before them rather than after the first one. */
    .cmp {
      position: relative;
      margin-top: 14px;
      margin-bottom: 18px;
    }

    .cmp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cmp-row input {
      flex: 1 1 200px;
      min-width: 0;
      padding: 7px 10px;
      font-size: 0.9rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      outline: none;
      -webkit-appearance: none;
    }

    .cmp-row input:focus {
      border-color: #bf3989;
      box-shadow: 0 0 0 3px rgba(191, 57, 137, 0.12);
    }

    .cmp-row input::placeholder {
      color: #8b949e;
    }

    /* Colours are set per chip, from the same palette as its line. */
    .cmp-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px 5px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-width: 100%;
    }

    .cmp-chip .cmp-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cmp-chip button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 3px;
      opacity: 0.7;
    }

    .cmp-chip button:hover {
      opacity: 1;
    }

    table.evo {
      width: 100%;
      border-collapse: collapse;
      /* Three readings to a cell: a size down keeps the run of them on one
         line at the width the page gives the table. */
      font-size: 0.78rem;
    }

    table.evo th,
    table.evo td {
      padding: 6px 4px;
      text-align: right;
      border-bottom: 1px solid #eef0f2;
    }

    table.evo th:first-child,
    table.evo td:first-child {
      text-align: left;
      color: #656d76;
    }

    table.evo th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b949e;
      font-weight: 600;
    }

    table.evo td {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Where even that does not fit, the table scrolls in its own box rather
       than pushing the page sideways. */
    #cTable {
      overflow-x: auto;
    }

    /* The three readings of a cell are one line and one colour: none of them is
       a gloss on the others, they are three ways of saying where the name stood
       that year. */
    .evo-pct {
      color: inherit;
    }

    .evo-rank {
      margin-left: 4px;
    }

    /* The name the line belongs to, set like every other name in the app. */
    .evo-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 500;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e8edf5;
      flex-wrap: wrap;
    }

    /* Each count opens the whole of its kind, so the tile is a button; it keeps
       the look of a plain figure until the pointer is on it. */
    .stat {
      text-align: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 4px 12px;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .stat:hover {
      background: #f6f8fa;
      border-color: #e8edf5;
    }

    .stat:active {
      background: #eef0f2;
    }

    .stat:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .stat {
        transition: none;
      }
    }

    .stat-num {
      font-size: 1.3rem;
      font-weight: 600;
      color: #24292f;
    }

    /* Each count is coloured like the kind it counts, the same blue, green and
       amber the pills and the ranking bars use. */
    .stat-num-file {
      color: #0969da;
    }

    .stat-num-dir {
      color: #1a7f37;
    }

    .stat-num-extension {
      color: #9a6700;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #656d76;
      margin-top: 2px;
    }

    .foot {
      text-align: center;
      color: #8b949e;
      font-size: 0.78rem;
      padding: 28px 16px 16px;
      border-top: 1px solid #e8edf5;
    }

    .foot a {
      color: #656d76;
    }

    /* The credit is a line of its own under the note, the mark set against the
       name the way the header sets it. */
    .foot-repo {
      margin-top: 6px;
    }

    .foot-repo a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      font-weight: 500;
    }

    .foot-repo a:hover {
      color: #24292f;
      text-decoration: underline;
    }

    /* Three sections per row on a wide screen, two then one as it narrows. */
    #top-list {
      padding: 20px 20px 32px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      #top-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      #top-list {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .top-group {
      min-width: 0;
    }

    .top-group-title {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Named in the colour of the bars below it, so a chart and its ranking are
       read as one. The pill classes carry those colours already. */
    .top-group-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0;
      background: none;
      padding: 0;
    }

    .top-group-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
    }

    .pill-toggle {
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .top-count {
      color: #8b949e;
      font-size: 0.8rem;
    }

    /* Top ten: a bar per name, its width the ratio today, so the section can be
       read as a ranking without looking at the numbers. */
    .rank {
      list-style: none;
    }

    .rank li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
    }

    .rank-pos {
      color: #8b949e;
      font-size: 0.75rem;
      /* Wide enough for the longest position in its own list, which the script
         sets: a ranking running into the thousands needs more room than a top
         ten, and without it the number ran into the name. */
      width: var(--pos, 18px);
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* The label column is a fixed share of the row, so every bar starts at the
       same x whether or not the row carries a pill; inside it the name is only
       as wide as its text, which keeps the pill next to the name. */
    .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      vertical-align: -3px;
    }

    /* Rows without an icon keep the gap anyway, so the columns after the bar
       line up whether or not devicon draws that extension. */
    span.ico {
      display: inline-block;
    }

    .detail-head .ico {
      width: 22px;
      height: 22px;
      margin-right: 8px;
    }

    .rank-label {
      /* A fixed share of the row, so every bar starts at the same x; narrow
         enough that a short name is not left stranded from its bar. */
      width: 36%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .rank-name {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      color: #24292f;
      text-decoration: underline;
      flex: 0 1 auto;
      min-width: 0;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-name:hover {
      opacity: 0.7;
    }

    .rank-bar {
      /* Long enough to compare rows by eye, short enough that the ranking does
         not read as a chart with a caption; it shrinks with a narrow column.
         That is the home page, where three rankings sit side by side; an item
         page gives one ranking the whole width, so there the bar takes it. */
      flex: 0 1 110px;
      height: 8px;
      background: #f0f2f5;
      border-radius: 4px;
      overflow: hidden;
      min-width: 0;
    }

    #cBody .rank-bar {
      flex: 1;
    }

    .rank-fill {
      height: 100%;
      border-radius: 4px;
      display: block;
    }

    .rank-fill-file {
      background: #0969da;
    }

    .rank-fill-dir {
      background: #1a7f37;
    }

    .rank-fill-extension {
      background: #d4a72c;
    }

    .rank-pct {
      font-size: 0.78rem;
      color: #656d76;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rank-arw {
      width: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .rank-delta {
      font-size: 0.78rem;
      font-weight: 600;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rank-label .pill {
      font-size: 0.65rem;
      padding: 1px 5px;
    }

    /* The same up/down/equal reading as the chart badge, small enough to sit
       next to a percentage. */
    .arw {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .arw-up {
      color: #1a7f37;
    }

    .arw-down {
      color: #cf222e;
    }

    .arw-flat {
      color: #8b949e;
    }

    .top-all {
      text-align: center;
      margin-top: 10px;
    }

    /* A link, not a button, but it wears the same pill so the row of charts
       ends the same way each time. */
    .see-all {
      text-decoration: none;
    }

    .row-rule {
      grid-column: 1 / -1;
      border-top: 1px solid #e8edf5;
    }

    .top-all-wide {
      grid-column: 1 / -1;
      margin-top: 0;
    }

    /* The year the row below is measured against, above the row it governs. */
    /* The heading of a section, spanning its three charts: the name of the
       ranking on a line of its own, then what it is measured against and the
       year that finishes that sentence. */
    .row-head {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .row-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0;
    }

    /* Set a little back from the title, and a size down: it marks the section,
       it does not name it. */
    .row-mark {
      font-size: 0.85em;
      margin-right: 7px;
    }

    /* Three lines, each with one job: the name of the ranking, what it is
       measured against, then the year to measure it against. */
    .row-sub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .row-note {
      color: #8b949e;
      font-size: 0.82rem;
    }

    /* Wrapping, since a narrow screen cannot hold four sections, three kinds or
       four years on one line. */
    .year-pick {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    /* On a "See all" page the same two lines sit under the page title, which is
       aligned left, so they follow it rather than the centred home heading. */
    .list-sub {
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .year-btn {
      font-variant-numeric: tabular-nums;
      padding: 4px 12px;
      font-size: 0.78rem;
    }

    /* A ranking can come up empty — nothing fell since 2025, say — and the
       chart says so rather than leaving a gap in the row. */
    .rank-none {
      color: #8b949e;
      font-size: 0.82rem;
      text-align: center;
      padding: 8px 0;
    }

    .year-btn.on,
    .kind-btn.on,
    .section-btn.on {
      color: #24292f;
      border-color: #24292f;
      background: #f6f8fa;
      font-weight: 600;
    }

    /* The kinds are words rather than years, so they are not held to the same
       column width the tabular figures above them keep. */
    .kind-btn,
    .section-btn {
      padding: 4px 12px;
      font-size: 0.78rem;
    }

    /* Beside a word this small the mark is a bullet, not a heading's badge. */
    .section-btn .row-mark {
      font-size: 0.95em;
      margin-right: 5px;
    }

    /* The same pill as the Back button: these open and close a ranking, so
       they read as controls rather than as links into one. */
    .top-toggle {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      color: #656d76;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .top-toggle:hover {
      color: #24292f;
      border-color: #8b949e;
      background: #f6f8fa;
    }

    .top-toggle:active {
      background: #eef0f2;
    }

    .top-toggle:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .top-toggle {
        transition: none;
      }
    }

    .top-link {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
      color: #24292f;
      font-size: 0.85rem;
    }

    .top-link:hover {
      opacity: 0.7;
    }

    @media (max-width: 500px) {
      .hero {
        padding: 40px 14px 24px;
      }

      .page h1 {
        font-size: 1.2rem;
      }

      .subtitle {
        font-size: 0.8rem;
        margin-bottom: 18px;
      }

      .sg-list {
        max-height: 50vh;
      }

      .detail {
        padding: 20px 16px 32px;
      }

      #picks {
        padding: 18px 14px 16px;
      }

      /* A phone reads the name and the reading; the bar is what gives way for
         them, since it is the one column that says nothing on its own. */
      .rank li {
        gap: 5px;
      }

      .rank-label {
        width: 46%;
      }

      .rank-bar {
        flex: 0 1 56px;
      }

      .rank-pct {
        width: 30px;
      }

      /* Thumb-sized, where a pointer only needed the text. */
      .top-toggle {
        padding: 7px 13px;
      }

      .year-btn,
      .kind-btn,
      .section-btn {
        padding: 6px 11px;
      }

      /* A "See all" page carries three rows of these — four sections, three
         kinds, four years — where the home page carries one, so they are set a
         size down to keep those rows short. */
      .list-sub .top-toggle {
        font-size: 0.7rem;
        padding: 5px 9px;
      }

      /* A long name and the share button share the line until they cannot. */
      .detail-head {
        flex-wrap: wrap;
      }

      .row-title {
        font-size: 1.15rem;
      }

      .stats {
        gap: 10px;
        margin-top: 18px;
        padding-top: 18px;
      }

      table.evo {
        font-size: 0.72rem;
      }

      table.evo th,
      table.evo td {
        padding: 6px 3px;
      }

      /* Four years of three readings will not sit on one line at this width, so
         a cell wraps rather than pushing the year columns off the page. */
      table.evo td {
        white-space: normal;
      }
    }
