<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>file-history - GitHub File History</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }

    /* The hero reads better narrow than the page is wide, so its content keeps
       the old width and stays centred. */
    .hero-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(180deg, #f0f6ff 0%, #ffffff 100%);
      padding: 60px 20px 32px;
      border-bottom: 1px solid #e8edf5;
    }

    .page h1 {
      font-size: 1.7rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #656d76;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Search */
    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-wrap input {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      outline: none;
      -webkit-appearance: none;
    }

    .search-wrap input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
    }

    .search-wrap input::placeholder {
      color: #8b949e;
    }

    /* Suggestions */
    .sg-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      -webkit-overflow-scrolling: touch;
    }

    .sg-list.open {
      display: block;
    }

    .sg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      cursor: pointer;
      gap: 8px;
    }

    .sg-item:not(:last-child) {
      border-bottom: 1px solid #eef0f2;
    }

    .sg-item:hover,
    .sg-item.on {
      background: #f6f8fa;
    }

    .sg-item-left {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 6px;
    }

    /* The row is spaced apart, so the icon would otherwise float in the middle;
       this pushes it against the pill at the right end. */
    .sg-item .ico {
      margin-left: auto;
    }

    .sg-name {
      font-weight: 500;
      font-size: 0.95rem;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .sg-hint {
      color: #8b949e;
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sg-empty {
      padding: 10px 14px;
      color: #8b949e;
      font-size: 0.875rem;
    }

    .pill {
      font-size: 0.73rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill-file {
      background: #ddf4ff;
      color: #0969da;
    }

    .pill-dir {
      background: #dafbe1;
      color: #1a7f37;
    }

    .pill-extension {
      background: #fff8c5;
      color: #9a6700;
    }

    /* Hover preview: the same chart the item page shows, small and following
       the pointer. It never takes the pointer, so moving onto it cannot happen
       and the row underneath keeps its hover. */
    #tip {
      position: fixed;
      z-index: 200;
      width: 320px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 10px 12px 6px;
      pointer-events: none;
    }

    #tip .tip-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    #tip .tip-name span.n {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (hover: none) {
      #tip {
        display: none !important;
      }
    }

    /* On an item page the hero keeps the repo link, the title and the subtitle;
       the search box and stats belong to the home page. */
    body.detail-view .search-wrap,
    body.detail-view .stats {
      display: none;
    }

    body.detail-view .hero {
      padding: 36px 20px 24px;
    }

    /* Detail view: a page of its own, shown in place of the home page. */
    .detail {
      padding: 28px 20px 40px;
      max-width: 620px;
      margin: 0 auto;
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef0f2;
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .detail-head h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* A control rather than a link: it is the one way out of an item page, so
       it takes the same pill shape as the page's other buttons and keeps its
       hit area on a touch screen. */
    .back {
      display: none;
      align-items: center;
      gap: 6px;
      /* Centred under the subtitle, like everything else in the header. */
      margin: 0 auto 16px;
      padding: 6px 12px 6px 9px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      color: #656d76;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    body.detail-view .back {
      display: flex;
      width: fit-content;
    }

    .back:hover {
      color: #24292f;
      border-color: #8b949e;
      background: #f6f8fa;
    }

    .back:active {
      background: #eef0f2;
    }

    .back:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    /* The arrow leads the way out, so it leans further out under the pointer. */
    .back svg {
      transition: transform 0.15s;
    }

    .back:hover svg {
      transform: translateX(-2px);
    }

    @media (prefers-reduced-motion: reduce) {

      .back,
      .back svg {
        transition: none;
      }
    }

    .card-share {
      background: none;
      border: none;
      font-size: 0.78rem;
      color: #656d76;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .card-share:hover {
      color: #24292f;
    }

    .card-body {
      padding: 4px 0 0;
    }

    .field {
      padding: 10px 0;
    }

    /* A section that follows a rule starts below it rather than against it. */
    .field+.field {
      border-top: 1px solid #eef0f2;
      padding-top: 20px;
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #656d76;
      margin-bottom: 6px;
    }

    /* A label with a control or a count on its right: the label keeps its
       spacing, the other half sits at the far end of the same row. Every
       section on an item page is headed this way. */
    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .field-head .field-label {
      margin-bottom: 6px;
    }

    h2.field-label {
      margin-top: 0;
    }

    /* An extension is a literal name, so it keeps its own case inside a label
       that is otherwise upper-cased. */
    .field-label .ext {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: none;
    }

    .field-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .scale-btn {
      background: none;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      color: #656d76;
      cursor: pointer;
      flex-shrink: 0;
    }

    .scale-btn:hover {
      color: #24292f;
      border-color: #8b949e;
    }

    /* Ready-made comparisons: a way into the chart for a reader who has not
       thought of two names to put side by side yet. */
    /* Matches the element's id: the row is #picks, not a class. */
    #picks {
      /* The hero's rule runs right above this row, so it needs room to breathe
         under the line rather than sitting on it, and a rule of its own closes
         the row off from the rankings below. */
      padding: 22px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #e8edf5;
    }

    /* Twenty of these, so they are packed tight and held to a readable measure
       rather than running the width of the page. */
    .pick-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Both classes, since the toggle's own rule comes later in this sheet and
       would otherwise win on source order. */
    .top-toggle.pick {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      padding: 4px 10px;
    }

    /* The separator is scaffolding between two names, so it steps back. */
    .pick .vs {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8b949e;
      padding: 0 3px;
    }

    /* Chart */
    .chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-grid {
      stroke: #eef0f2;
      stroke-width: 1;
    }

    .chart-axis {
      fill: #8b949e;
      font-size: 11px;
    }

    .chart-xlabel {
      fill: #656d76;
      font-size: 12px;
      font-weight: 500;
    }

    .chart-line {
      fill: none;
      stroke: #0969da;
      stroke-width: 2.5;
    }

    /* Bars stand in for the line. Each carries its series' colour as a fill
       attribute, so the rule here must not set one: a stylesheet fill would win
       over the attribute and paint every bar the same. */
    .chart-bar {
      stroke: none;
    }

    .chart-area {
      fill: rgba(9, 105, 218, 0.08);
    }

    .chart-dot {
      fill: #fff;
      stroke: #0969da;
      stroke-width: 2.5;
    }

    .chart-value {
      fill: #0969da;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    /* The comparison series. Each takes its stroke from the palette in the
       script, so the lines are told apart by colour. */
    .chart-line-b {
      fill: none;
      stroke-width: 2.5;
    }

    .chart-dot-b {
      fill: #fff;
      stroke-width: 2.5;
    }

    .chart-value-b {
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    .chart-key {
      font-size: 11px;
      font-weight: 600;
      fill: #24292f;
    }

    .chart-trend {
      font-size: 13px;
      font-weight: 600;
    }

    .chart-trend-up {
      fill: #1a7f37;
    }

    .chart-trend-down {
      fill: #cf222e;
    }

    .chart-trend-flat {
      fill: #656d76;
    }

    /* Compare picker: the same suggestion list as the home search, so it is
       driven the same way, sitting under the chart it changes. */
    .cmp {
      position: relative;
      margin-top: 12px;
    }

    .cmp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cmp-row input {
      flex: 1 1 200px;
      min-width: 0;
      padding: 7px 10px;
      font-size: 0.9rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      outline: none;
      -webkit-appearance: none;
    }

    .cmp-row input:focus {
      border-color: #bf3989;
      box-shadow: 0 0 0 3px rgba(191, 57, 137, 0.12);
    }

    .cmp-row input::placeholder {
      color: #8b949e;
    }

    /* Colours are set per chip, from the same palette as its line. */
    .cmp-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px 5px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-width: 100%;
    }

    .cmp-chip .cmp-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cmp-chip button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 3px;
      opacity: 0.7;
    }

    .cmp-chip button:hover {
      opacity: 1;
    }

    table.evo {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.evo th,
    table.evo td {
      padding: 6px 4px;
      text-align: right;
      border-bottom: 1px solid #eef0f2;
    }

    table.evo th:first-child,
    table.evo td:first-child {
      text-align: left;
      color: #656d76;
    }

    table.evo th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b949e;
      font-weight: 600;
    }

    table.evo td {
      font-variant-numeric: tabular-nums;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e8edf5;
      flex-wrap: wrap;
    }

    /* Each count opens the whole of its kind, so the tile is a button; it keeps
       the look of a plain figure until the pointer is on it. */
    .stat {
      text-align: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 4px 12px;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .stat:hover {
      background: #f6f8fa;
      border-color: #e8edf5;
    }

    .stat:active {
      background: #eef0f2;
    }

    .stat:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .stat {
        transition: none;
      }
    }

    .stat-num {
      font-size: 1.3rem;
      font-weight: 600;
      color: #24292f;
    }

    /* Each count is coloured like the kind it counts, the same blue, green and
       amber the pills and the ranking bars use. */
    .stat-num-file {
      color: #0969da;
    }

    .stat-num-dir {
      color: #1a7f37;
    }

    .stat-num-extension {
      color: #9a6700;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #656d76;
      margin-top: 2px;
    }

    .foot {
      text-align: center;
      color: #8b949e;
      font-size: 0.78rem;
      padding: 28px 16px 16px;
      border-top: 1px solid #e8edf5;
    }

    .foot a {
      color: #656d76;
    }

    /* Three sections per row on a wide screen, two then one as it narrows. */
    #top-list {
      padding: 20px 20px 32px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      #top-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      #top-list {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .top-group {
      min-width: 0;
    }

    .top-group-title {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .top-group-title h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
    }

    .pill-toggle {
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .top-count {
      color: #8b949e;
      font-size: 0.8rem;
    }

    /* Top ten: a bar per name, its width the ratio today, so the section can be
       read as a ranking without looking at the numbers. */
    .rank {
      list-style: none;
    }

    .rank li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
    }

    .rank-pos {
      color: #8b949e;
      font-size: 0.75rem;
      /* Wide enough for the longest position in its own list, which the script
         sets: a ranking running into the thousands needs more room than a top
         ten, and without it the number ran into the name. */
      width: var(--pos, 18px);
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* The label column is a fixed share of the row, so every bar starts at the
       same x whether or not the row carries a pill; inside it the name is only
       as wide as its text, which keeps the pill next to the name. */
    .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      vertical-align: -3px;
    }

    /* Rows without an icon keep the gap anyway, so the columns after the bar
       line up whether or not devicon draws that extension. */
    span.ico {
      display: inline-block;
    }

    .detail-head .ico {
      width: 22px;
      height: 22px;
      margin-right: 8px;
    }

    .rank-label {
      /* A fixed share of the row, so every bar starts at the same x; narrow
         enough that a short name is not left stranded from its bar. */
      width: 36%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .rank-name {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      color: #24292f;
      text-decoration: underline;
      flex: 0 1 auto;
      min-width: 0;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-name:hover {
      opacity: 0.7;
    }

    .rank-bar {
      /* Long enough to compare rows by eye, short enough that the ranking does
         not read as a chart with a caption; it shrinks with a narrow column.
         That is the home page, where three rankings sit side by side; an item
         page gives one ranking the whole width, so there the bar takes it. */
      flex: 0 1 110px;
      height: 8px;
      background: #f0f2f5;
      border-radius: 4px;
      overflow: hidden;
      min-width: 0;
    }

    #cBody .rank-bar {
      flex: 1;
    }

    .rank-fill {
      height: 100%;
      border-radius: 4px;
      display: block;
    }

    .rank-fill-file {
      background: #0969da;
    }

    .rank-fill-dir {
      background: #1a7f37;
    }

    .rank-fill-extension {
      background: #d4a72c;
    }

    .rank-pct {
      font-size: 0.78rem;
      color: #656d76;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rank-arw {
      width: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .rank-delta {
      font-size: 0.78rem;
      font-weight: 600;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rank-label .pill {
      font-size: 0.65rem;
      padding: 1px 5px;
    }

    /* The same up/down/equal reading as the chart badge, small enough to sit
       next to a percentage. */
    .arw {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .arw-up {
      color: #1a7f37;
    }

    .arw-down {
      color: #cf222e;
    }

    .arw-flat {
      color: #8b949e;
    }

    .top-all {
      text-align: center;
      margin-top: 10px;
    }

    .row-rule {
      grid-column: 1 / -1;
      border-top: 1px solid #e8edf5;
    }

    .top-all-wide {
      grid-column: 1 / -1;
      margin-top: 0;
    }

    /* The same pill as the Back button: these open and close a ranking, so
       they read as controls rather than as links into one. */
    .top-toggle {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      color: #656d76;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .top-toggle:hover {
      color: #24292f;
      border-color: #8b949e;
      background: #f6f8fa;
    }

    .top-toggle:active {
      background: #eef0f2;
    }

    .top-toggle:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .top-toggle {
        transition: none;
      }
    }

    .top-link {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
      color: #24292f;
      font-size: 0.85rem;
    }

    .top-link:hover {

  <!-- The table lives in data.js, written by build_index.py. A deep link such
       as /file/README.md would resolve a relative src against /file/, so where
       the app lives is worked out from the page's own location first.
       document.write keeps the load parser-blocking, which is what lets the app
       below stay a plain synchronous script. -->
  <script>
    var BASE = (function () {
      var segs = location.pathname.split('/');
      var kinds = ['file', 'dir', 'extension'];
      var last = segs[segs.length - 1], prev = segs[segs.length - 2];
      var item = kinds.indexOf(prev) >= 0 || (prev === 'all' && kinds.indexOf(last) >= 0);
      return segs.slice(0, item ? -2 : -1).join('/') + '/';
    })();
    document.write('<script src="' + BASE + 'data.js"><\/script>');
  </script>

  <script>
    var YEARS = DATA.years, ITEMS = DATA.items;
    var KINDS = ['file', 'dir', 'extension'];
    var KIND_LABEL = { file: 'file', dir: 'dir', extension: 'extension' };
    /* The table only carries names common enough to say something, so the
       search says where that line was drawn rather than naming a threshold the
       data might no longer match. */
    var MIN_FREQ = (function () {
      var m = Infinity;
      for (var i = 0; i < ITEMS.length; i++) m = Math.min(m, ITEMS[i].f[ITEMS[i].f.length - 1]);
      return m === Infinity ? 0 : m;
    })();

    var idx = -1, results = [], current = null;
    /* The extra series on the item page's chart, in the order they were added. */
    var compares = [];
    /* Whether the item page's axis is fitted to the lines drawn rather than run to
       100. It is a way of looking, not a property of the item, so it holds while
       the reader moves between pages. */
    var fitAxis = true;
    /* Whether the item page draws bars instead of a line. Like the axis, it is
       a way of looking rather than a property of the item, so it holds while the
       reader moves between pages. */
    var barChart = false;
    var HOME_TITLE = document.title;

    /* URLs are paths: <base>file/README.md, <base>dir/src, <base>extension/.md.
       An item path always ends in <kind>/<name>; BASE, whatever comes before
       that, is worked out by the loader above, which needs it first. */
    function pathParts() {
      var segs = location.pathname.split('/');
      var name = decodeURIComponent(segs[segs.length - 1] || '');
      var kind = segs[segs.length - 2] || '';
      if (name && KINDS.indexOf(kind) >= 0) {
        return { kind: kind, name: name };
      }
      /* <base>all/<kind> lists every name of that kind. "all" is not a kind, so
         it cannot collide with an item path. */
      if (kind === 'all' && KINDS.indexOf(name) >= 0) {
        return { kind: 'all', name: name };
      }
      return { kind: null, name: null };
    }

    function itemUrl(it) { return BASE + it.k + '/' + encodeURIComponent(it.n); }
    function allUrl(kind) { return BASE + 'all/' + kind; }

    /* A comparison is part of what the page shows, so it belongs in the URL: the
       link copied from a compared page opens compared. One vs= per extra name,
       which keeps names carrying a separator out of trouble. */
    function detailUrl(it, vs) {
      var q = [];
      /* A colon joins the kind to the name, and only the name is encoded, so the
         query reads vs=file:README.md rather than vs=file%2FREADME.md: a colon
         survives a query string unescaped where a slash does not. */
      for (var i = 0; i < (vs || []).length; i++) q.push('vs=' + vs[i].k + ':' + encodeURIComponent(vs[i].n));
      return itemUrl(it) + (q.length ? '?' + q.join('&') : '');
    }

    /* Some browsers refuse pushState on file:// URLs; the page still works, it just
       stops updating the address bar. */
    function navigate(url) {
      try { if (location.pathname + location.search !== url) history.pushState(null, '', url); }
      catch (e) { /* ignore: the view is what matters */ }
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function highlight(s, q) {
      var at = s.toLowerCase().indexOf(q.toLowerCase());
      if (!q || at < 0) return esc(s);
      return esc(s.slice(0, at)) + '<strong>' + esc(s.slice(at, at + q.length)) + '</strong>' + esc(s.slice(at + q.length));
    }

    function pill(kind) {
      return '<span class="pill pill-' + kind + '">' + esc(KIND_LABEL[kind]) + '</span>';
    }

    /* Extensions to devicon names (https://devicon.dev). Only the ones devicon
       actually draws are listed; anything missing simply gets no icon, and a name
       that turns out not to exist there is dropped when the image fails to load. */
    var DEVICON_BASE = 'https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/';
    var DEVICON = {
      '.md': 'markdown', '.mdx': 'markdown', '.markdown': 'markdown',
      '.js': 'javascript', '.mjs': 'javascript', '.cjs': 'javascript',
      '.ts': 'typescript', '.tsx': 'react', '.jsx': 'react',
      '.py': 'python', '.ipynb': 'jupyter', '.rb': 'ruby', '.go': 'go', '.rs': 'rust',
      '.java': 'java', '.jar': 'java', '.kt': 'kotlin', '.kts': 'kotlin',
      '.swift': 'swift', '.m': 'objectivec', '.mm': 'objectivec',
      '.c': 'c', '.h': 'c', '.cpp': 'cplusplus', '.cc': 'cplusplus', '.hpp': 'cplusplus',
      '.cs': 'csharp', '.php': 'php', '.pl': 'perl', '.lua': 'lua', '.r': 'r',
      '.scala': 'scala', '.clj': 'clojure', '.hs': 'haskell', '.ex': 'elixir', '.exs': 'elixir',
      '.dart': 'dart', '.vue': 'vuejs', '.svelte': 'svelte', '.zig': 'zig',
      '.html': 'html5', '.htm': 'html5', '.css': 'css3',
      '.scss': 'sass', '.sass': 'sass', '.less': 'less',
      '.json': 'json', '.yml': 'yaml', '.yaml': 'yaml', '.xml': 'xml',
      '.sh': 'bash', '.bash': 'bash', '.zsh': 'bash', '.ps1': 'powershell',
      '.sql': 'mysql', '.gradle': 'gradle', '.tf': 'terraform', '.cmake': 'cmake',
      '.dockerfile': 'docker', '.lock': 'npm'
    };

    /* devicon publishes different styles per icon, so the first one that loads
       wins and a name devicon does not have leaves an empty slot of the same size
       behind, so names stay aligned. */
    var ICON_BLANK = '<span class="ico"></span>';

    /* A file is drawn with the icon of its extension: index.html gets the HTML
       mark, package-info.java the Java one. Only the suffix is looked up, so a
       name carrying none (LICENSE) and a dotfile (.gitignore, whose leading dot
       is not a suffix) simply have no icon. */
    function deviconName(it) {
      if (it.k === 'extension') return DEVICON[it.n.toLowerCase()] || null;
      if (it.k !== 'file') return null;
      var dot = it.n.lastIndexOf('.');
      return dot > 0 ? DEVICON[it.n.slice(dot).toLowerCase()] || null : null;
    }

    function icon(it) {
      var name = deviconName(it);
      if (!name) return ICON_BLANK;
      return '<img class="ico" alt="" loading="lazy" src="' + DEVICON_BASE + name + '/' + name + '-original.svg"'
        + ' data-name="' + name + '" data-try="1" onerror="iconFallback(this)">';
    }

    /* An item page and the hover preview both lead with the name, so an icon that
       is not there leaves nothing behind: the blank the ranked rows keep is only
       there to hold their columns in line. */
    function titleIcon(it) {
      var html = icon(it);
      return html === ICON_BLANK ? '' : html.replace('class="ico"', 'class="ico ico-title"');
    }

    var ICON_STYLES = ['original', 'plain', 'line', 'original-wordmark', 'plain-wordmark'];
    function iconFallback(img) {
      var next = parseInt(img.dataset.try, 10);
      if (next >= ICON_STYLES.length) {
        if (img.classList.contains('ico-title')) img.remove(); else img.outerHTML = ICON_BLANK;
        return;
      }
      img.dataset.try = next + 1;
      img.src = DEVICON_BASE + img.dataset.name + '/' + img.dataset.name + '-' + ICON_STYLES[next] + '.svg';
    }
    window.iconFallback = iconFallback;

    function key(it) { return it.k + '#' + it.n; }
    function latest(it) { return it.r[it.r.length - 1]; }

    /* How the ratio moved from the first snapshot to the newest one, used by the
       chart badge, the suggestions and the rankings alike. */
    function delta(it) { return latest(it) - it.r[0]; }
    function direction(it) { var d = delta(it); return d > 0 ? 'up' : d < 0 ? 'down' : 'flat'; }
    function glyph(it) { var d = delta(it); return d > 0 ? '\u2191' : d < 0 ? '\u2193' : '='; }
    function arrow(it) {
      var dir = direction(it);
      return '<span class="arw arw-' + dir + '" title="' + glyph(it) + ' ' + (delta(it) > 0 ? '+' : '') + delta(it)
        + ' from ' + esc(YEARS[0]) + '">' + glyph(it) + '</span>';
    }

    /* Names starting with the query come first, the rest are matched anywhere, so
       typing "test" offers test/ and tests/ before jest.config.js. */
    function search(q) {
      if (!q) return [];
      var ql = q.toLowerCase(), starts = [], contains = [];
      for (var i = 0; i < ITEMS.length; i++) {
        var at = ITEMS[i].n.toLowerCase().indexOf(ql);
        if (at === 0) starts.push(ITEMS[i]);
        else if (at > 0) contains.push(ITEMS[i]);
        if (starts.length >= 15) break;
      }
      return starts.concat(contains).slice(0, 15);
    }

    var input = document.getElementById('q');
    var sg = document.getElementById('sg');

    function render(list, q) {
      idx = -1; results = list;
      if (!list.length) {
        if (q) {
          sg.innerHTML = '<div class="sg-empty">No results for "' + esc(q) + '" — only names in at least ' + MIN_FREQ + ' repositories today are listed</div>';
          sg.classList.add('open');
        } else { sg.innerHTML = ''; sg.classList.remove('open'); }
        return;
      }
      var html = '';
      for (var i = 0; i < list.length; i++) html += suggestion(list[i], i, q);
      sg.innerHTML = html;
      sg.classList.add('open');
      var rows = sg.querySelectorAll('.sg-item');
      for (var j = 0; j < rows.length; j++) {
        rows[j].addEventListener('click', (function (k) {
          return function () { show(results[k]); sg.classList.remove('open'); };
        })(j));
      }
    }

    /* One row of a suggestion list. The home search and the compare picker offer
       the same names in the same shape, so they share the markup. */
    function suggestion(it, i, q) {
      return '<div class="sg-item" data-i="' + i + '">'
        + '<div class="sg-item-left"><span class="sg-name">' + highlight(it.n, q) + '</span>'
        + '<span class="sg-hint">' + latest(it) + '% today ' + arrow(it) + '</span></div>'
        /* The icon sits with the pill at the right end. A row devicon cannot
           draw keeps the blank, so the pills stay in one column. */
        + icon(it) + pill(it.k) + '</div>';
    }

    /* The chart is drawn as plain SVG: one point per snapshot, the ratio on a
       fixed 0-100 axis so two names can be compared by eye. Passing a second item
       draws it as a dashed line over the same axis; the trend badge then gives way
       to a key, since a badge for one of two lines would be ambiguous. */
    /* The axis tops out at a round number a little above the tallest reading, so
       the highest point never sits on the frame; every candidate divides by four,
       which is how many gridlines the plot draws. */
    function axisTop(max) {
      var tops = [4, 8, 12, 16, 20, 24, 32, 40, 48, 60, 80, 100];
      for (var i = 0; i < tops.length; i++) if (tops[i] >= max * 1.05) return tops[i];
      return 100;
    }

    /* Passing fit true scales the axis to the series drawn; left out, the axis is
       the full 0-100, on which any two names can be compared by eye. The hover
       preview always takes that default, so previews stay comparable row to row. */
    function chart(it, vs, fit, bars) {
      var extra = vs || [];
      /* The right margin holds half of the last year label, which is centred on
         its point: at 14 the "today" label ran off the viewBox. */
      /* The bottom margin carries the year labels far enough under the plot
         that a reading written below a point sitting on zero still clears
         them. */
      var W = 440, L = 34, R = 24, B = 40, ph = 140;

      /* With a comparison the plot needs a key. It runs across the top, one
         name after another, and only takes a second line when the names are too
         long to fit on one. Without a comparison that row is the trend badge,
         one line high. */
      var keyed = extra.length ? [it].concat(extra) : [];
      /* The key sits above the plot, where the axis labels do not reach, so it
         starts at the chart's own left edge rather than the plot's. */
      var keyRows = keyLayout(keyed, W - R);
      var T = keyed.length ? 16 * keyRows.length + 12 : 40;
      var H = T + ph + B;
      var pw = W - L - R;
      var top = 100;
      if (fit) {
        var max = 0, series = [it].concat(extra);
        for (var m = 0; m < series.length; m++) {
          for (var r = 0; r < series[m].r.length; r++) max = Math.max(max, series[m].r[r]);
        }
        top = axisTop(max);
      }
      /* A line puts its points on the edges of the plot, so the first and last
         sit on the axis; bars stand in bands, each centred in its own share of
         the width. The year labels follow whichever is drawn. */
      var band = pw / YEARS.length;
      var x = bars
        ? function (i) { return L + band * (i + 0.5); }
        : function (i) { return L + (YEARS.length === 1 ? pw / 2 : pw * i / (YEARS.length - 1)); };
      var y = function (v) { return T + ph - ph * v / top; };

      /* The arrow says whether the name is more or less common now than in the
         first snapshot; it sits on its own row above the plot, so it never lands on
         a point label. */
      var diff = delta(it), dir = direction(it);
      var badge = glyph(it) + ' ' + (diff > 0 ? '+' : '') + diff + ' from ' + YEARS[0];

      var names = [];
      for (var ni = 0; ni < extra.length; ni++) names.push(extra[ni].n);
      var label = (extra.length ? it.n + ' against ' + names.join(', ') + ', ratio over time'
        : 'ratio over time, ' + dir + ' ' + diff + ' points') + ', axis to ' + top + '%'
        + (bars ? ', as bars' : '');
      var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">';
      if (keyed.length) {
        for (var kr = 0; kr < keyRows.length; kr++) {
          var kx = 0;
          for (var kc = 0; kc < keyRows[kr].length; kc++) {
            var ent = keyRows[kr][kc];
            svg += chartKey(kx, 14 + 16 * kr, ent.i === 0 ? null : cmpColor(ent.i - 1), ent.n);
            kx += ent.w + KEY_GAP;
          }
        }
      } else {
        /* Centred over the plot: it reads as a caption on the whole chart, not a
           note pinned to the last point. */
        svg += '<text class="chart-trend chart-trend-' + dir + '" x="' + (L + (W - L - R) / 2) + '" y="16" text-anchor="middle">' + esc(badge) + '</text>';
      }
      for (var g = 0; g <= top; g += top / 4) {
        svg += '<line class="chart-grid" x1="' + L + '" y1="' + y(g) + '" x2="' + (W - R) + '" y2="' + y(g) + '"/>'
          + '<text class="chart-axis" x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + g + '%</text>';
      }
      /* Both series write above their points. With a single comparison the two
         readings can land on each other, so where they come within a line of
         one another the lower of the two drops below its point instead; a tie
         sends the comparison down, the item's own line being the one read. */
      var itBelow = [], vsBelow = [];
      if (extra.length === 1) {
        for (var b = 0; b < YEARS.length; b++) {
          var clash = Math.abs(y(it.r[b]) - y(extra[0].r[b])) < 14;
          itBelow[b] = clash && it.r[b] < extra[0].r[b];
          vsBelow[b] = clash && !itBelow[b];
        }
      }
      /* Whichever side is chosen, the reading has to stay inside the plot: a
         point near the top of a fitted axis has no room above it for a label,
         and one near zero has none below before the year row. */
      function labelY(v, below) {
        var above = y(v) - 11, under = y(v) + 18;
        if (below) return under > H - 20 ? above : under;
        return above < T + 9 ? under : above;
      }

      function linePoints(series) {
        var p = [];
        for (var i = 0; i < YEARS.length; i++) p.push(x(i) + ',' + y(series.r[i]));
        return p;
      }
      /* The line closed down to the baseline, which is what gets washed in. */
      function areaPoints(p) {
        return x(0) + ',' + y(0) + ' ' + p.join(' ') + ' ' + x(YEARS.length - 1) + ',' + y(0);
      }

      if (bars) return svg + barPlot() + years() + '</svg>';

      /* Every series has the ground under it washed in its own colour, at the
         same weight as the item's own. The fills all go down before any line,
         so no wash lands on top of a stroke; the taller ones go first, so a
         short band is not buried under a tall one. */
      var pts = linePoints(it);
      var order = [];
      for (var o = 0; o < extra.length; o++) order.push(o);
      order.sort(function (a, b) { return latest(extra[b]) - latest(extra[a]); });
      for (var f = 0; f < order.length; f++) {
        svg += '<polygon fill="' + cmpColor(order[f]) + '14" points="' + areaPoints(linePoints(extra[order[f]])) + '"/>';
      }
      svg += '<polygon class="chart-area" points="' + areaPoints(pts) + '"/>';
      svg += '<polyline class="chart-line" points="' + pts.join(' ') + '"/>';
      for (var e = 0; e < extra.length; e++) {
        var c = cmpColor(e), vpts = [];
        for (var v = 0; v < YEARS.length; v++) vpts.push(x(v) + ',' + y(extra[e].r[v]));
        svg += '<polyline class="chart-line-b" stroke="' + c + '" points="' + vpts.join(' ') + '"/>';
        for (var w = 0; w < YEARS.length; w++) {
          svg += '<circle class="chart-dot-b" stroke="' + c + '" cx="' + x(w) + '" cy="' + y(extra[e].r[w]) + '" r="4.5"/>';
          /* One comparison can carry its readings; several cannot, since the
             numbers would sit on each other, so past the first the lines are
             read off the axis. */
          if (extra.length === 1) {
            svg += '<text class="chart-value-b" fill="' + c + '" x="' + x(w) + '" y="' + labelY(extra[e].r[w], vsBelow[w]) + '">' + extra[e].r[w] + '%</text>';
          }
        }
      }
      for (var i = 0; i < YEARS.length; i++) {
        svg += '<circle class="chart-dot" cx="' + x(i) + '" cy="' + y(it.r[i]) + '" r="4.5"/>'
          + '<text class="chart-value" x="' + x(i) + '" y="' + labelY(it.r[i], itBelow[i]) + '">' + it.r[i] + '%</text>';
      }
      return svg + years() + '</svg>';

      /* The year under each point or band, the one part both plots share. */
      function years() {
        var out = '';
        for (var i = 0; i < YEARS.length; i++) {
          out += '<text class="chart-xlabel" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(YEARS[i]) + '</text>';
        }
        return out;
      }

      /* One group of bars per snapshot, the series side by side in the order of
         the key, so a name keeps its place in every group. Every bar carries its
         reading: three of them still leave a column wide enough for "100%". */
      function barPlot() {
        var series = [it].concat(extra);
        var groupW = band * 0.78, bw = groupW / series.length, out = '';
        for (var i = 0; i < YEARS.length; i++) {
          var left = x(i) - groupW / 2;
          for (var j = 0; j < series.length; j++) {
            var v = series[j].r[i], bx = left + bw * j, bt = y(v);
            out += '<rect class="chart-bar" fill="' + (j ? cmpColor(j - 1) : LINE_COLOR) + '"'
              + ' x="' + bx + '" y="' + bt + '" width="' + Math.max(bw - 2, 1) + '" height="'
              + Math.max(T + ph - bt, 0) + '" rx="2"/>';
            /* The reading goes over the bar, unless the bar reaches too near
               the top of the plot for it to fit; then it is written inside the
               bar in white, where the colour under it cannot swallow it.
               chart-value-b, not chart-value: the latter fixes its fill in the
               stylesheet, which would override the colour set here. */
            var inside = bt - 6 < T + 9;
            out += '<text class="chart-value-b" fill="' + (inside ? '#fff' : (j ? cmpColor(j - 1) : LINE_COLOR)) + '"'
              + ' x="' + (bx + (bw - 2) / 2) + '" y="' + (inside ? bt + 14 : bt - 6) + '">' + v + '%</text>';
          }
        }
        return out;
      }
    }

    /* One key row: a dot in the series' own colour, then the name. A dot takes
       half the width of a rule, which is width the names can use instead. A null
       colour is the item's own series. */
    function chartKey(kx, ky, color, name) {
      return '<circle fill="' + (color || LINE_COLOR) + '" cx="' + (kx + 4) + '" cy="' + (ky - 4) + '" r="4"/>'
        + '<text class="chart-key" x="' + (kx + KEY_MARK) + '" y="' + ky + '">' + esc(name) + '</text>';
    }

    /* The key is laid out by hand, since SVG text does not wrap: an entry is the
       8px dot, a gap, and the name at roughly 6.2px a character in the 11px key
       font. Entries fill the row and start a new one only when the next will not
       fit, so two or three short names stay on one line. */
    var KEY_MARK = 13, KEY_GAP = 16, KEY_CHAR = 6.2, KEY_MAX_CHARS = 22;
    function keyLayout(keyed, width) {
      var rows = [], line = [], used = 0;
      for (var i = 0; i < keyed.length; i++) {
        var n = keyed[i].n;
        if (n.length > KEY_MAX_CHARS) n = n.slice(0, KEY_MAX_CHARS - 1) + '\u2026';
        var w = KEY_MARK + n.length * KEY_CHAR;
        if (line.length && used + KEY_GAP + w > width) { rows.push(line); line = []; used = 0; }
        line.push({ n: n, w: w, i: i });
        used += (used ? KEY_GAP : 0) + w;
      }
      if (line.length) rows.push(line);
      return rows;
    }

    /* Up to two comparisons, three lines with the item's own, each in its own
       colour, well apart from the blue the item is drawn in. */
    var CMP_MAX = 2;
    var CMP_COLORS = ['#bf3989', '#8250df'];
    var LINE_COLOR = '#0969da';  // the item's own series, matching .chart-line
    function cmpColor(i) { return CMP_COLORS[i % CMP_COLORS.length]; }

    function table(it) {
      var head = '<tr><th>Snapshot</th><th>Repositories</th><th>Ratio</th></tr>';
      var body = '';
      for (var i = 0; i < YEARS.length; i++) {
        body += '<tr><td>' + esc(YEARS[i]) + '</td><td>' + it.f[i] + '</td><td>' + it.r[i] + '%</td></tr>';
      }
      return '<table class="evo">' + head + body + '</table>';
    }

    /* Opening an item is a navigation: it pushes a history entry, so Back returns
       to the home page and the browser's own buttons work. */
    function show(it) {
      navigate(detailUrl(it, []));
      renderDetail(it, []);
    }

    /* An extension says how many repositories carry it at all; which names do the
       carrying is a different question, so its page ranks its own files too. */
    /* The files a test picks out, ranked by ratio today, as indices into ITEMS. */
    function filesWhere(pred) {
      var rows = [];
      for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].k === 'file' && pred(ITEMS[i])) rows.push(i);
      rows.sort(function (a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); });
      return rows;
    }

    function extensionFiles(ext) {
      var suffix = ext.toLowerCase();
      return filesWhere(function (f) {
        var n = f.n.toLowerCase();
        return n.length > suffix.length && n.slice(-suffix.length) === suffix;
      });
    }

    /* A file page ends with the names it sits among: the top ten of its own
       extension, exactly as the extension page ranks them, the file itself
       included so its place among them can be read off.

       Two kinds of name have no extension to be grouped by, and each is a group
       in its own right: a dotfile (.gitignore), whose leading dot is a mark of
       the name rather than a suffix, and a bare name (LICENSE, Makefile). A
       dotted name that also carries a suffix (.travis.yml) belongs with its
       suffix, so the extension is tested first. */
    function fileGroup(name) {
      var dot = name.lastIndexOf('.');
      if (dot > 0) {
        var ext = name.slice(dot).toLowerCase();
        return { rows: extensionFiles(ext), label: '<span class="ext">' + esc(ext) + '</span> files' };
      }
      if (dot === 0) {
        return {
          rows: filesWhere(function (f) { return f.n.lastIndexOf('.') === 0; }),
          label: 'dotfiles'
        };
      }
      return {
        rows: filesWhere(function (f) { return f.n.indexOf('.') < 0; }),
        label: 'files with no extension'
      };
    }

    function relatedField(it) {
      if (it.k !== 'file') return '';
      var group = fileGroup(it.n), rows = group.rows;
      if (rows.length < 2) return '';

      var top = rows.slice(0, TOP_N);
      var html = '<div class="field"><div class="field-head">'
        + '<h2 class="field-label">Top ' + top.length + ' ' + group.label + '</h2>'
        + '<span class="top-count">of ' + rows.length + '</span></div><ol class="rank">';
      for (var o = 0; o < top.length; o++) html += rankRow(o + 1, top[o], false);
      return html + '</ol></div>';
    }

    /* Ten is enough to read at a glance; the rest are the same ranking further
       down, so they are drawn like the first ten and hidden behind a toggle. */
    function filesField(it) {
      if (it.k !== 'extension') return '';
      var rows = extensionFiles(it.n);
      if (!rows.length) return '';
      var top = rows.slice(0, TOP_N), rest = rows.slice(TOP_N);
      var html = '<div class="field"><div class="field-head">'
        + '<h2 class="field-label">Top ' + top.length + ' <span class="ext">' + esc(it.n) + '</span> files</h2>'
        + '<span class="top-count">of ' + rows.length + '</span></div>'
        + '<ol class="rank"' + posWidth(rows.length) + '>';
      for (var i = 0; i < top.length; i++) html += rankRow(i + 1, top[i], false);
      html += '</ol>';
      if (rest.length) {
        html += '<ol class="rank files-more" start="' + (TOP_N + 1) + '"'
          + ' style="display:none;--pos:' + Math.max(18, 4 + String(rows.length).length * 7) + 'px">';
        for (var j = 0; j < rest.length; j++) html += rankRow(TOP_N + j + 1, rest[j], false);
        html += '</ol><div class="top-all"><button class="top-toggle files-toggle">Show top '
          + rows.length + '</button></div>';
      }
      return html + '</div>';
    }

    /* Compare picker ----------------------------------------------------------
       The chart and the picker under it are two halves of one choice, so both are
       redrawn whenever the comparison changes: a chip while a name is being
       compared, the search box again once it is removed. */
    function drawCompare() {
      document.getElementById('cChart').innerHTML = chart(current, compares, fitAxis, barChart);
      var scale = document.getElementById('cScale');
      scale.textContent = fitAxis ? 'Show 0-100%' : 'Fit to data';
      scale.setAttribute('aria-pressed', fitAxis ? 'true' : 'false');
      var type = document.getElementById('cType');
      /* Each button says what a click gives, not what is drawn. */
      type.textContent = barChart ? 'Line chart' : 'Bar chart';
      type.setAttribute('aria-pressed', barChart ? 'true' : 'false');
      var row = document.getElementById('cmpRow'), html = '';
      for (var i = 0; i < compares.length; i++) {
        var c = cmpColor(i);
        html += '<span class="cmp-chip" style="color:' + c + ';background:' + c + '14">'
          + '<span class="cmp-name">' + esc(compares[i].n) + '</span>'
          + '<button type="button" data-cmp="' + i + '"'
          + ' aria-label="Remove ' + esc(compares[i].n) + ' from the chart">\u00d7</button></span>';
      }
      /* The box goes away once the chart is full: three lines is as much as the
         key and the plot stay readable with. */
      if (compares.length < CMP_MAX) {
        html += '<input type="text" id="cmpInput" autocomplete="off" placeholder="'
          + (compares.length ? 'Compare...' : 'Compare with another file, dir, or extension') + '">';
      }
      row.innerHTML = html;

      var drops = row.querySelectorAll('.cmp-chip button');
      for (var d = 0; d < drops.length; d++) {
        drops[d].addEventListener('click', (function (btn) {
          return function () { removeCompare(parseInt(btn.dataset.cmp, 10)); };
        })(drops[d]));
      }
      var box = document.getElementById('cmpInput');
      if (box) wireCompare(box);
      closeCmp();
    }

    function addCompare(it) {
      if (!it || compares.length >= CMP_MAX || compares.indexOf(it) >= 0) return;
      /* Names are read against each other by height, which bars say plainly;
         the line is still a click away. */
      if (!compares.length) barChart = true;
      compares.push(it);
      commitCompare();
    }

    function removeCompare(i) {
      compares.splice(i, 1);
      commitCompare();
    }

    function commitCompare() {
      navigate(detailUrl(current, compares));
      drawCompare();
    }

    var cmpIdx = -1, cmpResults = [];

    function closeCmp() {
      var list = document.getElementById('cmpSg');
      if (list) { list.innerHTML = ''; list.classList.remove('open'); }
      cmpIdx = -1; cmpResults = [];
    }

    /* The same search as the home page, minus the names already on the chart. */
    function renderCmp(q) {
      var list = document.getElementById('cmpSg');
      var found = search(q).filter(function (x) { return x !== current && compares.indexOf(x) < 0; });
      cmpIdx = -1; cmpResults = found;
      if (!found.length) {
        if (q) {
          list.innerHTML = '<div class="sg-empty">No results for "' + esc(q) + '"</div>';
          list.classList.add('open');
        } else { list.innerHTML = ''; list.classList.remove('open'); }
        return;
      }
      var html = '';
      for (var i = 0; i < found.length; i++) html += suggestion(found[i], i, q);
      list.innerHTML = html;
      list.classList.add('open');
      var rows = list.querySelectorAll('.sg-item');
      for (var j = 0; j < rows.length; j++) {
        rows[j].addEventListener('click', (function (k) {
          return function () { addCompare(cmpResults[k]); };
        })(j));
      }
    }

    function wireCompare(box) {
      box.addEventListener('input', function () { renderCmp(box.value.trim()); });
      box.addEventListener('focus', function () { if (box.value.trim()) renderCmp(box.value.trim()); });
      box.addEventListener('keydown', function (e) {
        var items = document.getElementById('cmpSg').querySelectorAll('.sg-item');
        /* Escape closes the picker; the page-level handler would otherwise take
           it as leaving the item page. */
        if (e.key === 'Escape') { e.stopPropagation(); closeCmp(); return; }
        if (!items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); cmpIdx = Math.min(cmpIdx + 1, items.length - 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); cmpIdx = Math.max(cmpIdx - 1, 0); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          addCompare(cmpResults[cmpIdx < 0 ? 0 : cmpIdx]);
          return;
        } else return;
        for (var i = 0; i < items.length; i++) {
          if (i === cmpIdx) { items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' }); }
          else items[i].classList.remove('on');
        }
      });
    }

    function renderDetail(it, vs) {
      current = it;
      var asked = (vs || []).length;
      compares = (vs || []).filter(function (x) { return x && x !== it; }).slice(0, CMP_MAX);
      /* A page opened comparing opens as bars, whatever was last chosen. */
      if (compares.length) barChart = true;
      /* A link may name more than the chart takes; the address bar should say
         what is actually drawn. */
      if (asked > compares.length) {
        try { history.replaceState(null, '', detailUrl(it, compares)); } catch (e) { }
      }
      document.getElementById('cTitle').innerHTML = titleIcon(it) + esc(it.n);
      document.getElementById('cPill').innerHTML = pill(it.k);
      var body = document.getElementById('cBody');
      body.innerHTML =
        '<div class="field"><div class="field-head"><div class="field-label">Repositories (%)</div>'
        + '<div class="field-actions">'
        + '<button type="button" class="scale-btn" id="cScale" aria-pressed="false"></button>'
        + '<button type="button" class="scale-btn" id="cType" aria-pressed="false"></button></div></div>'
        + '<div id="cChart"></div>'
        + '<div class="cmp" id="cmp"><div class="cmp-row" id="cmpRow"></div>'
        + '<div class="sg-list" id="cmpSg"></div></div>'
        + '</div>'
        + '<div class="field"><div class="field-head"><div class="field-label">Snapshots</div></div>'
        + table(it) + '</div>'
        + filesField(it)
        + relatedField(it);
      document.getElementById('cScale').addEventListener('click', function () {
        fitAxis = !fitAxis;
        drawCompare();
      });
      document.getElementById('cType').addEventListener('click', function () {
        barChart = !barChart;
        drawCompare();
      });
      drawCompare();
      var links = body.querySelectorAll('.top-link');
      for (var li = 0; li < links.length; li++) {
        links[li].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i, 10)]); };
        })(links[li]));
      }
      var toggle = body.querySelector('.files-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var more = body.querySelector('.files-more');
          var collapsed = more.style.display === 'none';
          more.style.display = collapsed ? '' : 'none';
          toggle.textContent = collapsed ? 'Show top ' + TOP_N : 'Show top ' + (TOP_N + more.children.length);
        });
      }
      document.title = it.n + ' - GitHub File History';
      document.getElementById('home').hidden = true;
      document.getElementById('detail').hidden = false;
      document.body.classList.add('detail-view');
      sg.classList.remove('open');
      window.scrollTo(0, 0);
    }

    /* The whole of one kind, ranked by ratio today: the same rows as the home
       page's top tens, with nothing held back. It is a page in its own right,
       so it is reached by a path and shares the item page's frame. */
    var KIND_PLURAL = { file: 'Files', dir: 'Directories', extension: 'Extensions' };

    function showAll(kind) {
      navigate(allUrl(kind));
      renderAll(kind);
    }

    function renderAll(kind) {
      current = null;
      compares = [];
      var rows = [];
      for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].k === kind) rows.push(i);
      rows.sort(function (a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); });

      document.getElementById('cTitle').textContent = KIND_PLURAL[kind] || kind;
      document.getElementById('cPill').innerHTML = pill(kind);
      var body = document.getElementById('cBody');
      var html = '<div class="field"><div class="field-head">'
        + '<div class="field-label">Ranked by ratio today</div>'
        + '<span class="top-count">' + rows.length + ' names</span></div>'
        + '<ol class="rank"' + posWidth(rows.length) + '>';
      for (var r = 0; r < rows.length; r++) html += rankRow(r + 1, rows[r], false);
      body.innerHTML = html + '</ol></div>';

      var links = body.querySelectorAll('.top-link');
      for (var li = 0; li < links.length; li++) {
        links[li].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i, 10)]); };
        })(links[li]));
      }
      document.title = (KIND_PLURAL[kind] || kind) + ' - GitHub File History';
      document.getElementById('home').hidden = true;
      document.getElementById('detail').hidden = false;
      document.body.classList.add('detail-view');
      sg.classList.remove('open');
      window.scrollTo(0, 0);
    }

    function showHome() {
      current = null;
      document.getElementById('detail').hidden = true;
      document.getElementById('home').hidden = false;
      document.body.classList.remove('detail-view');
      document.title = HOME_TITLE;
    }

    function byName(name) {
      for (var i = 0; i < ITEMS.length; i++) {
        if (ITEMS[i].n.toLowerCase() === name.toLowerCase()) return ITEMS[i];
      }
      return null;
    }

    /* The path is the router. Old #<kind>#<name> links are still honoured, and are
       rewritten to the path form so only one shape of URL is ever shared. */
    function route() {
      var hash = location.hash.slice(1);
      if (hash) {
        var cut = hash.indexOf('#');
        var old = cut < 0 ? byName(decodeURIComponent(hash))
          : byKey(hash.slice(0, cut) + '#' + decodeURIComponent(hash.slice(cut + 1)));
        if (old) {
          try { history.replaceState(null, '', itemUrl(old)); } catch (e) { }
          renderDetail(old);
          return;
        }
      }
      var at = pathParts();
      if (at.kind === 'all') { renderAll(at.name); return; }
      var it = at.kind ? byKey(at.kind + '#' + at.name) || byName(at.name) : null;
      if (it) renderDetail(it, vsFromQuery()); else showHome();
    }

    /* One vs=<kind>:<name> per extra series, each falling back to a bare name for
       a hand-written link. The slash form earlier links used is still read, so
       those keep working. Names that match nothing are dropped. */
    function vsFromQuery() {
      var re = /[?&]vs=([^&]*)/g, out = [], m;
      while ((m = re.exec(location.search))) {
        var raw = decodeURIComponent(m[1].replace(/\+/g, ' '));
        var cut = raw.search(/[:/]/);
        var it = (cut > 0 ? byKey(raw.slice(0, cut) + '#' + raw.slice(cut + 1)) : null) || byName(raw);
        if (it && out.indexOf(it) < 0) out.push(it);
      }
      return out;
    }

    function byKey(k) {
      for (var i = 0; i < ITEMS.length; i++) if (key(ITEMS[i]) === k) return ITEMS[i];
      return null;
    }

    /* Comparisons worth a look, each a name and the one or two it is read
       against. A pick naming something the data does not carry is dropped, so
       the row survives a rebuild that retires a name. */
    var PICKS = [
      ['file#AGENTS.md', 'file#CLAUDE.md'],
      ['extension#.js', 'extension#.ts'],
      ['dir#test', 'dir#tests'],
      ['extension#.java', 'extension#.kt'],
      ['file#setup.py', 'file#pyproject.toml'],
      ['extension#.yml', 'extension#.yaml'],
      ['dir#src', 'dir#lib', 'dir#app'],
      ['file#Dockerfile', 'file#docker-compose.yml'],
      ['dir#docs', 'dir#doc', 'dir#documentation'],
      ['extension#.png', 'extension#.svg', 'extension#.jpg'],
      ['file#.eslintrc.js', 'file#.eslintrc.json'],
      ['file#webpack.config.js', 'file#vite.config.ts'],
      ['file#README.md', 'file#readme.md', 'file#README.txt'],
      ['file#.travis.yml', 'dir#workflows', 'dir#.circleci'],
      ['file#LICENSE', 'file#LICENSE.md', 'file#LICENSE.txt'],
    ];

    var PICK_SETS = [];
    var PICKS_SHOWN = 3;  // a handful to try, not the whole list

    function showPicks() {
      var box = document.getElementById('picks');
      var ready = [];
      for (var p = 0; p < PICKS.length; p++) {
        var set = [], ok = true;
        for (var k = 0; k < PICKS[p].length; k++) {
          var it = byKey(PICKS[p][k]);
          if (!it) { ok = false; break; }
          set.push(it);
        }
        if (ok && set.length >= 2) ready.push(set);
      }

      /* A different handful each visit, so the whole list gets seen over time.
         Drawn without replacement, taking the tail of a partial shuffle. */
      for (var i = ready.length - 1; i > 0 && ready.length - i <= PICKS_SHOWN; i--) {
        var j = Math.floor(Math.random() * (i + 1)), swap = ready[i];
        ready[i] = ready[j];
        ready[j] = swap;
      }
      var sets = PICK_SETS = ready.slice(Math.max(0, ready.length - PICKS_SHOWN));

      var html = '';
      for (var q = 0; q < sets.length; q++) {
        var names = [];
        for (var n = 0; n < sets[q].length; n++) names.push(esc(sets[q][n].n));
        html += '<button type="button" class="top-toggle pick" data-p="' + q + '">'
          /* Non-breaking spaces, so the gap around the separator is kept
             whatever the markup does with ordinary whitespace. */
          + names.join('<span class="vs">\u00a0vs\u00a0</span>') + '</button>';
      }
      if (!sets.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="pick-list">' + html + '</div>';
      var btns = box.querySelectorAll('.pick');
      for (var b = 0; b < btns.length; b++) {
        btns[b].addEventListener('click', (function (set) {
          return function () {
            navigate(detailUrl(set[0], set.slice(1)));
            renderDetail(set[0], set.slice(1));
          };
        })(sets[parseInt(btns[b].dataset.p, 10)]));
      }
    }

    function showStats() {
      var counts = {};
      for (var i = 0; i < ITEMS.length; i++) counts[ITEMS[i].k] = (counts[ITEMS[i].k] || 0) + 1;
      var stats = [
        { n: counts.file || 0, l: 'Files', k: 'file' },
        { n: counts.dir || 0, l: 'Directories', k: 'dir' },
        { n: counts.extension || 0, l: 'Extensions', k: 'extension' }
      ];
      var html = '';
      for (var i = 0; i < stats.length; i++) {
        html += '<button type="button" class="stat" data-kind="' + stats[i].k + '">'
          + '<div class="stat-num stat-num-' + stats[i].k + '">' + stats[i].n + '</div>'
          + '<div class="stat-label">' + stats[i].l + '</div></button>';
      }
      var box = document.getElementById('stats');
      box.innerHTML = html;
      var tiles = box.querySelectorAll('.stat');
      for (var t = 0; t < tiles.length; t++) {
        tiles[t].addEventListener('click', (function (btn) {
          return function () { showAll(btn.dataset.kind); };
        })(tiles[t]));
      }
    }

    /* Each kind gets its top ten by ratio today, with the rest of its names behind
       a toggle: the long lists are useful but should not push the sections apart. */
    var TOP_N = 10;
    var TOP_MORE = 100;  // how far the ranking goes once it is expanded

    /* One ranked row: the bar is the ratio today, so rows can be compared across
       sections even when the ranking itself is by something else. */
    /* The width the position column needs for a list ending at this number. */
    function posWidth(max) {
      return ' style="--pos:' + Math.max(18, 4 + String(max).length * 7) + 'px"';
    }

    function rankRow(pos, i, withPill) {
      var it = ITEMS[i];
      return '<li><span class="rank-pos">' + pos + '</span>'
        + '<span class="rank-label">'
        + '<button class="top-link rank-name" data-i="' + i + '" title="' + esc(it.n) + '">' + esc(it.n) + '</button>'
        + (withPill ? pill(it.k) : '') + '</span>'
        + icon(it)
        + '<span class="rank-bar"><span class="rank-fill rank-fill-' + it.k + '" style="width:' + latest(it) + '%"></span></span>'
        + '<span class="rank-pct">' + latest(it) + '%</span>'
        /* Only the sections that rank by movement carry the change; in the top tens
           the ratio is the ranking, so points and arrow would just be noise. */
        + (withPill
          ? '<span class="rank-delta arw-' + direction(it) + '">' + (delta(it) > 0 ? '+' : '') + delta(it) + '</span>'
          + '<span class="rank-arw">' + arrow(it) + '</span>'
          : '')
        + '</li>';
    }

    function section(title, note, rows, withPill) {
      if (!rows.length) return '';
      var top = rows.slice(0, TOP_N), rest = rows.slice(TOP_N);
      var html = '<div class="top-group"><div class="top-group-title"><h2>' + title + '</h2>'
        + '<span class="top-count">' + note + '</span></div>'
        + '<ol class="rank"' + posWidth(rows.length) + '>';
      for (var i = 0; i < top.length; i++) html += rankRow(i + 1, top[i], withPill);
      html += '</ol>';
      /* The rest of the ranking, drawn the same way and hidden until the button
         under the row opens all three sections together. */
      if (rest.length) {
        html += '<ol class="rank top-more" start="' + (TOP_N + 1) + '"'
          + ' style="display:none;--pos:' + Math.max(18, 4 + String(rows.length).length * 7) + 'px">';
        for (var j = 0; j < rest.length; j++) html += rankRow(TOP_N + j + 1, rest[j], withPill);
        html += '</ol>';
      }
      return html + '</div>';
    }

    /* The toggle that spans a row of rankings; its scope names the row it opens. */
    function wideToggle(scope, more) {
      return '<div class="top-all top-all-wide"><button class="top-toggle" data-scope="' + scope
        + '" data-more="' + more + '">Show top ' + more + '</button></div>';
    }

    function showTop() {
      var groups = {}, all = [];
      for (var i = 0; i < ITEMS.length; i++) {
        (groups[ITEMS[i].k] = groups[ITEMS[i].k] || []).push(i);
        all.push(i);
      }
      var html = '', deeper = TOP_N;
      for (var ki = 0; ki < KINDS.length; ki++) {
        var kind = KINDS[ki], list = groups[kind];
        if (!list || !list.length) continue;
        list.sort(function (a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); });

        /* The extra rows are the same ranking, just further down it, so they are
           drawn like the first ten rather than as a list of bare names. */
        var top = list.slice(0, TOP_N), rest = list.slice(TOP_N, TOP_MORE);
        html += '<div class="top-group" data-kind="' + esc(kind) + '">'
          + '<div class="top-group-title"><h2>Top ' + top.length + '</h2>' + pill(kind)
          + '<span class="top-count">of ' + list.length + '</span></div>'
          + '<ol class="rank"' + posWidth(Math.min(list.length, TOP_MORE)) + '>';
        for (var li = 0; li < top.length; li++) html += rankRow(li + 1, top[li], false);
        html += '</ol>';
        if (rest.length) {
          html += '<ol class="rank top-more" start="' + (TOP_N + 1) + '"'
            + ' style="display:none;--pos:' + Math.max(18, 4 + String(TOP_N + rest.length).length * 7) + 'px">';
          for (var ri = 0; ri < rest.length; ri++) html += rankRow(TOP_N + ri + 1, rest[ri], false);
          html += '</ol>';
          deeper = Math.max(deeper, TOP_N + rest.length);
        }
        html += '</div>';
      }

      /* The rankings above are dominated by names that were already everywhere in
         2015, so movement gets sections of its own: what grew the most, what fell
         the most, and what did not exist in any earlier snapshot at all. */
      /* These sections rank by how much the ratio moved in points, not by the ratio
         itself, so the bars do not descend here the way they do above. A name that
         is new moved by its whole ratio, which is why that one looks sorted by %. */
      function byRatio(a, b) { return latest(ITEMS[b]) - latest(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); }
      function byGain(a, b) { return delta(ITEMS[b]) - delta(ITEMS[a]) || ITEMS[a].n.localeCompare(ITEMS[b].n); }
      function byDrop(a, b) { return delta(ITEMS[a]) - delta(ITEMS[b]) || ITEMS[a].n.localeCompare(ITEMS[b].n); }

      var rising = all.filter(function (i) { return delta(ITEMS[i]) > 0; }).sort(byGain).slice(0, TOP_MORE);
      var decaying = all.filter(function (i) { return delta(ITEMS[i]) < 0; }).sort(byDrop).slice(0, TOP_MORE);
      /* New means new since the snapshot before this one: no repository had the
         name then, some do now. What it did before that does not matter, so a
         name that was around in 2015, vanished by 2020 and is back today counts
         as new again. */
      var was = YEARS.length - 2;
      var fresh = (was < 0 ? [] : all.filter(function (i) {
        var f = ITEMS[i].f;
        return f[was] === 0 && f[f.length - 1] > 0;
      }))
        .sort(byGain)
        .slice(0, TOP_MORE);

      var moving = section('Increasing', 'biggest gain since ' + esc(YEARS[0]), rising, true)
        + section('Decreasing', 'biggest drop since ' + esc(YEARS[0]), decaying, true)
        + section('New', 'absent in ' + esc(YEARS[was]), fresh, true);
      /* A button per row of sections, not per section: each row is read side by
         side, so expanding one section at a time would leave the row ragged. */
      if (deeper > TOP_N) {
        html += wideToggle('kind', deeper);
      }
      /* A rule across the grid: the three rankings by kind are one row, the
         three by movement another, and the eye should not run between them. */
      html += '<div class="row-rule"></div>' + moving;
      var movingDeep = Math.max(rising.length, decaying.length, fresh.length);
      if (movingDeep > TOP_N) {
        html += wideToggle('moving', movingDeep);
      }

      var tl = document.getElementById('top-list');
      tl.innerHTML = html;
      var links = tl.querySelectorAll('.top-link');
      for (var bi = 0; bi < links.length; bi++) {
        links[bi].addEventListener('click', (function (btn) {
          return function () { show(ITEMS[parseInt(btn.dataset.i)]); };
        })(links[bi]));
      }
      var toggles = tl.querySelectorAll('.top-toggle');
      for (var pi = 0; pi < toggles.length; pi++) {
        toggles[pi].addEventListener('click', (function (btn) {
          return function () {
            var more = tl.querySelectorAll(btn.dataset.scope === 'kind'
              ? '[data-kind] .top-more' : '.top-group:not([data-kind]) .top-more');
            var collapsed = more.length && more[0].style.display === 'none';
            for (var mi = 0; mi < more.length; mi++) more[mi].style.display = collapsed ? '' : 'none';
            btn.textContent = 'Show top ' + (collapsed ? TOP_N : btn.dataset.more);
          };
        })(toggles[pi]));
      }
    }

    /* Back walks the history when this page was reached from the home page, and
       otherwise goes to the base URL, which is the home page. */
    function goBack() {
      if (history.length > 1 && document.referrer !== '') { history.back(); return; }
      navigate(BASE);
      route();
    }

    document.getElementById('dBack').addEventListener('click', goBack);
    document.getElementById('cShare').addEventListener('click', function () {
      navigator.clipboard.writeText(location.href).then(function () {
        var btn = document.getElementById('cShare');
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"/></svg>Copy link'; }, 1500);
      });
    });
    window.addEventListener('popstate', route);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('detail').hidden) goBack();
    });

    input.addEventListener('input', function () { var q = input.value.trim(); render(search(q), q); });
    input.addEventListener('keydown', function (e) {
      var items = sg.querySelectorAll('.sg-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); hi(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); hi(items); }
      else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); show(results[idx]); sg.classList.remove('open'); }
      else if (e.key === 'Escape') sg.classList.remove('open');
    });

    function hi(items) {
      for (var i = 0; i < items.length; i++) {
        if (i === idx) { items[i].classList.add('on'); items[i].scrollIntoView({ block: 'nearest' }); }
        else items[i].classList.remove('on');
      }
    }

    document.addEventListener('click', function (e) {
      if (!document.getElementById('sw').contains(e.target)) sg.classList.remove('open');
      var cmp = document.getElementById('cmp');
      if (cmp && !cmp.contains(e.target)) closeCmp();
    });

    /* Hover preview -----------------------------------------------------------
       Ranked rows and the ready-made comparisons preview: a suggestion list is
       already a hover target being read top to bottom, and a chart following the
       pointer there would sit on top of the next suggestion. */
    var tip = document.getElementById('tip');

    function hoveredItem(el) {
      var row = el.closest ? el.closest('[data-i]') : null;
      if (!row || row.classList.contains('sg-item')) return null;
      return ITEMS[parseInt(row.dataset.i, 10)] || null;
    }

    function placeTip(x, y) {
      var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + pad, top = y + pad;
      if (left + w > window.innerWidth - 8) left = x - pad - w;
      if (top + h > window.innerHeight - 8) top = Math.max(8, y - pad - h);
      tip.style.left = Math.max(8, left) + 'px';
      tip.style.top = top + 'px';
    }

    function hideTip() { tip.hidden = true; }

    document.addEventListener('mouseover', function (e) {
      /* A pick previews the whole comparison it opens, drawn the way the page
         behind it would draw it: bars, since that is how a comparison opens. */
      var btn = e.target.closest ? e.target.closest('.pick') : null;
      if (btn) {
        var set = PICK_SETS[parseInt(btn.dataset.p, 10)];
        if (set) {
          if (tip.dataset.k !== 'pick' + btn.dataset.p) {
            tip.dataset.k = 'pick' + btn.dataset.p;
            tip.innerHTML = chart(set[0], set.slice(1), fitAxis, true);
          }
          tip.hidden = false;
          placeTip(e.clientX, e.clientY);
          return;
        }
      }
      var it = hoveredItem(e.target);
      if (!it) { hideTip(); return; }
      if (tip.dataset.k !== key(it)) {
        tip.dataset.k = key(it);
        tip.innerHTML = '<div class="tip-name">' + titleIcon(it) + '<span class="n">' + esc(it.n) + '</span>' + pill(it.k) + '</div>' + chart(it);
      }
      tip.hidden = false;
      placeTip(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', function (e) {
      if (!tip.hidden) placeTip(e.clientX, e.clientY);
    });

    window.addEventListener('scroll', hideTip, true);
    document.addEventListener('click', hideTip);

    showStats();
    showPicks();
    showTop();
    route();
    if (document.getElementById('detail').hidden) input.focus();
  </script>
</body>

</html>
